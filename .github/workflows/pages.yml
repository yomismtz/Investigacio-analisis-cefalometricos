name: Publish Yornis website

on:
  push:
    branches: [main, fix/individual-study-selector-2026-09-17]
    paths:
      - 'docs/**'
      - 'desktop/assets/yornis_logo_chunk_*.b64'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build high-definition web branding
        shell: bash
        run: |
          python -m pip install pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import base64, hashlib, io
          parts = sorted(Path('desktop/assets').glob('yornis_logo_chunk_*.b64'))
          assert len(parts) == 12
          source = base64.b64decode(''.join(p.read_text(encoding='utf-8').strip() for p in parts), validate=True)
          assert hashlib.sha256(source).hexdigest() == '076f10e95b384ef8da2caf98006d8c84ea43a3108275553516e0a2657bba68b9'
          original = Image.open(io.BytesIO(source)).convert('RGBA')
          canvas = Image.new('RGBA', (512, 512), (255, 255, 255, 255))
          inner = original.resize((420, 420), Image.Resampling.LANCZOS)
          canvas.alpha_composite(inner, (46, 20))
          out = Path('docs/assets/yornis-logo.png')
          out.parent.mkdir(parents=True, exist_ok=True)
          canvas.save(out, optimize=True)
          assert Image.open(out).size == (512, 512)
          print('web logo built at 512px:', out, out.stat().st_size)
          PY
      - name: Prepare original bird audio samples
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import io
          import zipfile

          parts = [Path(f'ci/website-bird-samples-part{i:02}.b64') for i in range(1, 7)]
          assert all(p.is_file() for p in parts), 'Missing encoded bird audio chunks'
          encoded = ''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          archive_bytes = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(archive_bytes).hexdigest() == '46cef919738e703ce3266cf2f2d5e45d08f4b51b4fbecd442d1ecebe08123ee4'
          expected = {
              'Agaporni.mp3', 'Tucan.mp3', 'Pavorreal.mp3', 'Ninfa.mp3', 'Faisan.mp3',
              'Quetzal.mp3', 'Guacamaya_Roja.mp3', 'Guacamaya_Azul.mp3', 'Buho.mp3', 'Colibri.mp3'
          }
          output = Path('docs/assets/bird-audio')
          output.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(io.BytesIO(archive_bytes)) as zf:
              assert set(zf.namelist()) == expected, f'Unexpected bird audio files: {zf.namelist()}'
              for name in sorted(expected):
                  data = zf.read(name)
                  assert len(data) > 1000 and data[:3] == b'ID3', f'Invalid MP3: {name}'
                  (output / name).write_bytes(data)
          assert len(list(output.glob('*.mp3'))) == 10
          print('Prepared ten original bird recording excerpts for the website')
          PY

      - name: Validate static site
        shell: bash
        run: |
          test -f docs/index.html
          test -f docs/styles.css
          test -f docs/app.js
          test -f docs/assets/yornis-logo.png
          test -f docs/revision-edad-sexo-lordosis-via-aerea-craneocervical-2026.md
          test -f docs/yornis-v01592-scroll-bird-sounds.md
          test -f docs/yornis-individual-flow-interface-2026-09-17.md
          grep -q "Yornis" docs/index.html
          grep -q "v0.16.2" docs/index.html
          grep -q "Individual Flow" docs/index.html
          grep -q "10 paletas" docs/index.html
          grep -q "Scroll vertical" docs/index.html
          grep -q "Caso individual" docs/index.html
          grep -q "análisis → medidas/ángulos → puntos" docs/index.html
          grep -q "Yomira Salgado Martínez" docs/index.html
          grep -q "Individual Flow" docs/index.html
          grep -q "releases/latest" docs/index.html
          grep -q "Lordosis C1–C7" docs/app.js
          grep -q "sin corte universal 35–45" docs/app.js
          grep -q "birdAudioFiles" docs/app.js
          ! grep -q "createOscillator\|AudioContext" docs/app.js
          test -f docs/assets/bird-audio/Agaporni.mp3
          test -f docs/assets/bird-audio/Tucan.mp3
          test -f docs/assets/bird-audio/Pavorreal.mp3
          test -f docs/assets/bird-audio/Ninfa.mp3
          test -f docs/assets/bird-audio/Faisan.mp3
          test -f docs/assets/bird-audio/Quetzal.mp3
          test -f docs/assets/bird-audio/Guacamaya_Roja.mp3
          test -f docs/assets/bird-audio/Guacamaya_Azul.mp3
          test -f docs/assets/bird-audio/Buho.mp3
          test -f docs/assets/bird-audio/Colibri.mp3
          grep -q "playBirdSignature" docs/app.js
          grep -q "Guacamaya Azul" docs/app.js
          grep -q "Búho" docs/app.js
          grep -q "Colibrí" docs/app.js
          grep -q "bird-audio/Buho.mp3" docs/app.js
          grep -q "bird-audio/Colibri.mp3" docs/app.js
          grep -q "bird-volume" docs/index.html
          grep -q "bird-audio/Colibri.mp3" docs/app.js
          grep -q "filter-chip" docs/app.js
          grep -q "focus-visible" docs/styles.css
          grep -q "IntersectionObserver" docs/app.js

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build high-definition web branding
        shell: bash
        run: |
          python -m pip install pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import base64, hashlib, io
          parts = sorted(Path('desktop/assets').glob('yornis_logo_chunk_*.b64'))
          assert len(parts) == 12
          source = base64.b64decode(''.join(p.read_text(encoding='utf-8').strip() for p in parts), validate=True)
          assert hashlib.sha256(source).hexdigest() == '076f10e95b384ef8da2caf98006d8c84ea43a3108275553516e0a2657bba68b9'
          original = Image.open(io.BytesIO(source)).convert('RGBA')
          canvas = Image.new('RGBA', (512, 512), (255, 255, 255, 255))
          inner = original.resize((420, 420), Image.Resampling.LANCZOS)
          canvas.alpha_composite(inner, (46, 20))
          out = Path('docs/assets/yornis-logo.png')
          out.parent.mkdir(parents=True, exist_ok=True)
          canvas.save(out, optimize=True)
          assert Image.open(out).size == (512, 512)
          PY
      - name: Prepare original bird audio samples
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import io
          import zipfile

          parts = [Path(f'ci/website-bird-samples-part{i:02}.b64') for i in range(1, 7)]
          assert all(p.is_file() for p in parts), 'Missing encoded bird audio chunks'
          encoded = ''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          archive_bytes = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(archive_bytes).hexdigest() == '46cef919738e703ce3266cf2f2d5e45d08f4b51b4fbecd442d1ecebe08123ee4'
          expected = {
              'Agaporni.mp3', 'Tucan.mp3', 'Pavorreal.mp3', 'Ninfa.mp3', 'Faisan.mp3',
              'Quetzal.mp3', 'Guacamaya_Roja.mp3', 'Guacamaya_Azul.mp3', 'Buho.mp3', 'Colibri.mp3'
          }
          output = Path('docs/assets/bird-audio')
          output.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(io.BytesIO(archive_bytes)) as zf:
              assert set(zf.namelist()) == expected, f'Unexpected bird audio files: {zf.namelist()}'
              for name in sorted(expected):
                  data = zf.read(name)
                  assert len(data) > 1000 and data[:3] == b'ID3', f'Invalid MP3: {name}'
                  (output / name).write_bytes(data)
          assert len(list(output.glob('*.mp3'))) == 10
          print('Prepared ten original bird recording excerpts for the website')
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
