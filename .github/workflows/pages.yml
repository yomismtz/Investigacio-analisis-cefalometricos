name: Publish Yornis website

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'desktop/assets/yornis_logo_chunk_*.b64'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build high-definition web branding
        shell: bash
        run: |
          python -m pip install pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import base64, hashlib, io
          parts = sorted(Path('desktop/assets').glob('yornis_logo_chunk_*.b64'))
          assert len(parts) == 12
          source = base64.b64decode(''.join(p.read_text(encoding='utf-8').strip() for p in parts), validate=True)
          assert hashlib.sha256(source).hexdigest() == '076f10e95b384ef8da2caf98006d8c84ea43a3108275553516e0a2657bba68b9'
          original = Image.open(io.BytesIO(source)).convert('RGBA')
          canvas = Image.new('RGBA', (512, 512), (255, 255, 255, 255))
          inner = original.resize((420, 420), Image.Resampling.LANCZOS)
          canvas.alpha_composite(inner, (46, 20))
          out = Path('docs/assets/yornis-logo.png')
          out.parent.mkdir(parents=True, exist_ok=True)
          canvas.save(out, optimize=True)
          assert Image.open(out).size == (512, 512)
          print('web logo built at 512px:', out, out.stat().st_size)
          PY
      - name: Validate static site
        shell: bash
        run: |
          test -f docs/index.html
          test -f docs/styles.css
          test -f docs/app.js
          test -f docs/assets/yornis-logo.png
          test -f docs/revision-edad-sexo-lordosis-via-aerea-craneocervical-2026.md
          test -f docs/yornis-v01592-scroll-bird-sounds.md
          grep -q "Yornis" docs/index.html
          grep -q "v0.15.9.2" docs/index.html
          grep -q "Scroll + Bird Sounds" docs/index.html
          grep -q "8 firmas sonoras" docs/index.html
          grep -q "Scroll vertical" docs/index.html
          grep -q "43 pruebas" docs/index.html
          grep -q "releases/latest" docs/index.html
          grep -q "Lordosis C1–C7" docs/app.js
          grep -q "sin corte universal 35–45" docs/app.js
          grep -q "birdSignatures" docs/app.js
          grep -q "playBirdSignature" docs/app.js
          grep -q "Guacamaya Azul" docs/app.js
          grep -q "filter-chip" docs/app.js
          grep -q "focus-visible" docs/styles.css
          grep -q "IntersectionObserver" docs/app.js
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        if: github.event_name != 'pull_request'
        uses: actions/deploy-pages@v4
