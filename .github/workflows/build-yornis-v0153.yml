name: Build Yornis v0.15.3 Clinical Quality HiDPI
on:
  workflow_dispatch:
  pull_request:
    branches: [ main, feature/yornis-v0152-cervical-dpi ]
    paths: ['desktop/**','.github/workflows/build-yornis-v0153.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        shell: pwsh
        run: python -m pip install pillow pymupdf reportlab openpyxl pyinstaller pyzipper
      - name: Restore logo
        shell: pwsh
        run: |
          @'
          import base64,hashlib
          from pathlib import Path
          from PIL import Image
          hashes=['08e2c18c1229ae0db0cdb7162bf1866686da2a5302a32dabd5bea078defce43d','1c67f7b94c7cc957398b37d5d82aea88e848f44fc51bc07c326dc0c825a0a77d','1adcf93696d7732204c8c7f17fb9ba66c7f66fa7306dcf0bcdd3bcda6d9591e5','072cdae528a073d41065027dd6149311e30ab56ee1525c3188edd5ada4debd46','4ed235b0bc89c66d1e2d2d087432c8e01531276d01a143ef09fe8044038fff74','640864304af438d08e8894ab08e4d15496ce1bea09234d59702bad24ee14a05a','044111ef3f14609e29fce0ce13172414083e5dd1533074953ef38e1bbc18e036','50363e5da8e2ad83109563fb3213ba85f61d8e647fdc800a2e34759691952190','81351072f4506e5ef3aafe6b0831f8b77debe5b67cd94718dbf7ee7715234136','d8027243deb52973c3083ceb62e8fc21ad35c996e5e2e907f90d4536cb71b5c4','3353a967f7d02a37990d853206a985a151c391219c9966cb78e0aa0d018dda29','4e6283855be363989458f80e46515a3169aad708107222037821df5539831275']
          chunks=[]
          for i,h in enumerate(hashes):
              s=Path(f'desktop/assets/yornis_logo_chunk_{i:02d}.b64').read_text(encoding='utf-8').strip();assert hashlib.sha256(s.encode('ascii')).hexdigest()==h;chunks.append(s)
          raw=base64.b64decode(''.join(chunks),validate=True);assert hashlib.sha256(raw).hexdigest()=='076f10e95b384ef8da2caf98006d8c84ea43a3108275553516e0a2657bba68b9'
          Path('desktop/assets/yornis_logo.png').write_bytes(raw);Path('desktop/assets/yomceph_logo.png').write_bytes(raw)
          im=Image.open('desktop/assets/yornis_logo.png').convert('RGBA');assert im.size==(192,192);im.save('desktop/assets/yornis.ico',sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(192,192)])
          '@ | python -
      - name: Syntax and clinical audit v0.15.3
        shell: pwsh
        run: |
          Get-ChildItem desktop\yornis_*.py | ForEach-Object { python -m py_compile $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          @'
          import sys
          sys.path.insert(0,'desktop')
          import classic_engine as e
          import yornis_ceph_quality_v0153 as q
          import yornis_clinical_audit_v0151 as audit
          import yornis_cervical_v0152 as cv
          import yornis_alignment_v0152 as al
          import research_protocol as rp
          import research_ui
          import research_stability_db_v0141

          # v0.15.3: 98 base + 3 COGS additions + 1 cervical numeric measurement.
          assert len(e.MEASUREMENTS)==102, len(e.MEASUREMENTS)
          assert sum(m.analysis=='Burstone COGS' for m in e.MEASUREMENTS)==23
          by={(m.analysis,m.name):m for m in e.MEASUREMENTS}
          assert by[('Legan–Burstone',"G'-Sn / Sn-Me'")].kind=='hp_perp_ratio'
          assert by[('Legan–Burstone',"Sn-Stms / Stmi-Me'")].kind=='hp_perp_ratio'
          assert by[('Legan–Burstone','Brecha interlabial Stms-Stmi')].kind=='hp_perp_pair'
          hold=[m for m in e.MEASUREMENTS if m.analysis=='Holdaway' and 'Espesor de mentón' in m.name]
          assert len(hold)==1 and hold[0].kind=='holdaway_chin_thickness'
          for name in ('U6-NF altura','L6-MP altura','B-Pg // MP'):
              assert ('Burstone COGS',name) in by
          assert all(hasattr(m,'norm_text') and m.norm_text for m in e.MEASUREMENTS)

          # Formula checks with synthetic geometry.
          g=by[('Legan–Burstone',"G'-Sn / Sn-Me'")]
          pts={"G'":(0.,0.),'Sn':(4.,10.),"Me'":(8.,30.),'S':(0.,0.),'N':(10.,0.),'Po':(0.,10.),'Or':(10.,10.)}
          assert abs(e.compute(g,pts,1.,'right')-0.5)<1e-9
          gap=by[('Legan–Burstone','Brecha interlabial Stms-Stmi')]
          pts.update({'Stms':(3.,4.),'Stmi':(8.,8.)})
          assert abs(e.compute(gap,pts,1.,'right')-4.0)<1e-9
          h=hold[0]
          hp={'SPg':(0.,0.),'N':(0.,-20.),'Pg':(0.,20.),'NS':(11.,-20.),'SPgS':(11.,20.),'Po':(0.,10.),'Or':(10.,10.)}
          assert abs(e.compute(h,hp,1.,'right')-11.0)<1e-9
          bpg=by[('Burstone COGS','B-Pg // MP')]
          assert abs(e.compute(bpg,{'B':(1.,2.),'Pg':(9.,2.),'Go':(0.,0.),'Me':(10.,0.)},1.,'right')-8.0)<1e-9

          # Research integration: preserve engine references and expose special outcomes.
          research_stability_db_v0141.install()
          audit.install(research_ui.ResearchWorkspace)
          cv.install_research(research_ui.ResearchWorkspace)
          al.install_research(research_ui.ResearchWorkspace)
          q.install_research(research_ui.ResearchWorkspace)
          catalog=rp.analysis_catalog()
          assert len(catalog['Sassouni'])>=13
          assert catalog[cv.CVM_ANALYSIS]
          assert catalog[al.ALIGNMENT_ANALYSIS]
          sna=next(v for v in catalog['Steiner'] if v.name=='SNA')
          assert '82' in rp.reference_for(sna,'F',20)
          assert 'pobl' in rp.reference_for(sna,'F',20).lower() or 'hist' in rp.reference_for(sna,'F',20).lower()
          assert len(getattr(e,'SASSOUNI_POINTS',()))>=20

          # Cervical modules remain intact.
          canonical=[(('no','no','no','trapezoidal','trapezoidal'),1),(('si','no','no','trapezoidal','trapezoidal'),2),(('si','si','no','trapezoidal','horizontal'),3),(('si','si','si','horizontal','horizontal'),4),(('si','si','si','cuadrada','horizontal'),5),(('si','si','si','vertical','cuadrada'),6)]
          for args,stage in canonical: assert cv.classify_cvm(*args)['stage']==stage
          assert al.ALIGNMENT_CODEBOOK=={'Lordosis normal':1,'Rectificación':2,'Cifosis':3,'Hiperlordosis':4}
          print('YORNIS v0.15.3 CLINICAL QUALITY AUDIT OK')
          '@ | python -
      - name: Capacity and GUI HiDPI
        shell: pwsh
        run: |
          @'
          import sys,tkinter.font as tkfont
          from pathlib import Path
          sys.path.insert(0,'desktop')
          from yornis_desktop_v015 import Launcher,research_app,APP_VERSION
          assert APP_VERSION.startswith('0.15.3')
          assert 'PerMonitorV2' in Path('desktop/yornis_windows.manifest').read_text(encoding='utf-8')
          a=Launcher();a.withdraw();a.update_idletasks();assert float(a.tk.call('tk','scaling'))>0;assert 'Segoe UI' in tkfont.nametofont('TkDefaultFont',root=a).actual('family');a.destroy()
          r=research_app('es');r.withdraw();r.update_idletasks();assert hasattr(r,'profile_side_var');r.destroy()
          print('HIDPI + PER-MONITOR-V2 GUI OK')
          '@ | python -
      - name: Build application
        shell: pwsh
        run: pyinstaller --noconfirm --clean --onedir --windowed --name Yornis --icon desktop/assets/yornis.ico --manifest desktop/yornis_windows.manifest --paths desktop --hidden-import classic_engine --hidden-import yomceph_desktop_v130_classic --hidden-import research_db --hidden-import research_protocol --hidden-import research_ui --hidden-import research_ui_compat --hidden-import research_enhancements --hidden-import research_stability_db_v0141 --hidden-import research_stability_ui_core_v0141 --hidden-import research_stability_ui_perf_v0141 --hidden-import research_stability_export_ui_v0141 --hidden-import yornis_theme --hidden-import yornis_storage_v015 --hidden-import yornis_import_v015 --hidden-import yornis_background_import_v015 --hidden-import yornis_research_controls_v015 --hidden-import yornis_ui_theme_v015 --hidden-import yornis_spss_v015 --hidden-import yornis_visual_report_v015 --hidden-import yornis_export_ui_v015 --hidden-import yornis_backup_v015 --hidden-import yornis_backup_ui_v015 --hidden-import yornis_clinical_audit_v0151 --hidden-import yornis_cervical_v0152 --hidden-import yornis_alignment_v0152 --hidden-import yornis_display_v0152 --hidden-import yornis_ceph_quality_v0153 --collect-all PIL --collect-all pymupdf --collect-all reportlab --collect-all openpyxl --collect-all pyzipper --add-data "desktop/assets/yornis_logo.png;." --add-data "desktop/assets/yomceph_logo.png;." --add-data "desktop/assets/yornis.ico;." desktop/yornis_desktop_v015.py
      - name: Cold start
        shell: pwsh
        run: |
          $p=Start-Process -FilePath (Resolve-Path 'dist/Yornis/Yornis.exe') -PassThru; Start-Sleep 8; if($p.HasExited){throw 'Yornis exited during cold start'}; Stop-Process -Id $p.Id -Force
          $exe=Resolve-Path 'dist/Yornis/Yornis.exe';$bytes=[IO.File]::ReadAllBytes($exe);if($bytes[0]-ne 0x4D -or $bytes[1]-ne 0x5A){throw 'Missing MZ'};Get-FileHash $exe -Algorithm SHA256
      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          New-Item -ItemType Directory -Force -Path dist-installer-yornis | Out-Null
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' desktop\Yornis_v0153.iss
          $setup='dist-installer-yornis/Yornis_Setup_v0.15.3_Clinical_Quality_HiDPI.exe';if(!(Test-Path $setup)){throw 'Installer missing'};$bytes=[IO.File]::ReadAllBytes($setup);if($bytes[0]-ne 0x4D -or $bytes[1]-ne 0x5A){throw 'Installer missing MZ'};Get-FileHash $setup -Algorithm SHA256
          Compress-Archive -Path dist\Yornis\* -DestinationPath dist-installer-yornis\Yornis_v0.15.3_Clinical_Quality_HiDPI_Portable.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Yornis-v0.15.3-Clinical-Quality-HiDPI-Windows-x64
          path: |
            dist-installer-yornis/Yornis_Setup_v0.15.3_Clinical_Quality_HiDPI.exe
            dist-installer-yornis/Yornis_v0.15.3_Clinical_Quality_HiDPI_Portable.zip
          if-no-files-found: error
