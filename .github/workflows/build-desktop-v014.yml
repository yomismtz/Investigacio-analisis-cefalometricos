name: Build YomCeph Desktop v0.14 Research Suite

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'desktop/**'
      - '.github/workflows/build-desktop-v014.yml'

permissions:
  contents: read

jobs:
  windows-v014:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow pymupdf reportlab openpyxl pyinstaller

      - name: Restore and verify original YomCeph logo
        shell: pwsh
        run: |
          @'
          import base64, hashlib
          from pathlib import Path
          from PIL import Image
          expected_chunks = [
              '88bf8b9cf9310c3a7a599ddb109b73859002d7c5c7f5e29b345c506999c2f4d1',
              '2e245334c261e09a67ef49279a5ce3add9e405f078c1698317f7d95957dd02a8',
              '9c306c7f9a1f07216d17a01e1a5990e10ff82fcc5bf8c25e57a7d6f13ef68989',
              '835bbe268c81056351f2c4b65d8288bc1da7967716fa4bd0354565f64803f73f',
          ]
          chunks=[]
          for i, expected in enumerate(expected_chunks):
              s=Path(f'desktop/assets/logo_exact_{i:02d}.b64').read_text(encoding='utf-8').strip()
              got=hashlib.sha256(s.encode('ascii')).hexdigest()
              assert got == expected, (i, got, expected, len(s))
              chunks.append(s)
          raw=base64.b64decode(''.join(chunks), validate=True)
          file_sha=hashlib.sha256(raw).hexdigest()
          assert file_sha == 'be024e025d7b58e0c801101b2b4dead72a416dff806eae18aea40667cbdd71ba', file_sha
          p=Path('desktop/assets/yomceph_logo.png')
          p.write_bytes(raw)
          im=Image.open(p).convert('RGBA')
          assert im.size == (512,512), im.size
          pixel_sha=hashlib.sha256(im.tobytes()).hexdigest()
          assert pixel_sha == 'ab5d02d5e1508320d5eec5a06d6f2796b59392292b726413c226456c18e96300', pixel_sha
          im.save('desktop/assets/yomceph.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          print('Original YomCeph identity restored:', im.size, file_sha, pixel_sha)
          '@ | python -

      - name: Syntax check
        shell: pwsh
        run: |
          python -m py_compile `
            desktop/classic_engine.py `
            desktop/yomceph_theme.py `
            desktop/research_db.py `
            desktop/research_protocol.py `
            desktop/research_export.py `
            desktop/research_enhancements.py `
            desktop/research_ui.py `
            desktop/yomceph_desktop_v014.py `
            desktop/yomceph_desktop_v130_classic.py

      - name: Research suite unit tests
        shell: pwsh
        run: python -m unittest discover -s desktop/tests -p 'test_*.py' -v

      - name: Catalog and 30-feature integrity checks
        shell: pwsh
        run: |
          @'
          import sys, tempfile, zipfile
          from pathlib import Path
          sys.path.insert(0,'desktop')
          import research_protocol as p
          import research_enhancements as enhancements
          from research_db import ResearchDB, MAX_CASES
          enhancements.install()
          assert MAX_CASES == 1000
          cat=p.analysis_catalog(); assert len(cat)>=10, len(cat)
          keys=[v.key for vs in cat.values() for v in vs][:8]
          summary=p.shared_landmark_summary(keys)
          assert summary['measurement_count']==len(keys)
          assert summary['unique_landmark_count']>0
          with tempfile.TemporaryDirectory() as td:
              db=ResearchDB(Path(td)/'r.sqlite3')
              sid=db.create_study('Smoke')
              cfg={'selected_variables':keys,'required_landmarks':p.minimum_landmarks(keys),'blind_mode':True,'randomize_order':True}
              assert db.save_protocol(sid,cfg)==1
              db.lock_protocol(sid)
              assert db.save_protocol(sid,cfg)==2
              cid=db.add_case(sid,'0001',sex='F',age=12)
              # Exact analysis::measurement completion: a same-name measurement from another analysis cannot complete the case.
              v=p.selected_variables(keys)[0]
              db.save_trace(cid,2,{q:(10.0+i,20.0+i) for i,q in enumerate(v.points)},[{'analysis':'Wrong analysis','measurement':v.name,'value':1.0,'unit':v.unit}],[],0.1)
              assert db.case(cid)['status'] != 'complete'
              values=db.case_criteria_values(cid); assert values == {}
              criteria=db.criteria(sid); db.set_case_criteria(cid,{int(criteria[0]['id']):True}); assert db.case_criteria_values(cid)[int(criteria[0]['id'])]
              backup=Path(td)/'backup.zip'; db.backup_study(sid,backup); assert backup.exists()
              with zipfile.ZipFile(backup) as z: assert 'database/yomceph_research.sqlite3' in z.namelist()
              db.exclude_case(cid,'Calidad radiográfica insuficiente')
              assert db.case(cid)['status']=='excluded'
              assert len(db.audit_rows(sid))>=6
          print('Research integrity checks OK:', len(cat), 'analyses,', summary)
          '@ | python -

      - name: GUI construction smoke test
        shell: pwsh
        run: |
          @'
          import sys
          sys.path.insert(0,'desktop')
          from yomceph_desktop_v014 import Launcher
          import research_ui, research_enhancements
          research_enhancements.install(research_ui.ResearchWorkspace)
          a=Launcher(); a.withdraw(); a.update_idletasks(); assert a.logo_photo is not None; a.destroy()
          r=research_ui.ResearchWorkspace('es'); r.withdraw(); r.update_idletasks(); assert r.title().startswith('YomCeph Desktop'); assert hasattr(r,'case_checklist_dialog'); r.destroy()
          print('Launcher and research GUI smoke test OK')
          '@ | python -

      - name: Build full Windows application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed `
            --name YomCeph_Desktop `
            --icon desktop/assets/yomceph.ico `
            --paths desktop `
            --hidden-import classic_engine `
            --hidden-import yomceph_desktop_v130_classic `
            --hidden-import research_db `
            --hidden-import research_protocol `
            --hidden-import research_export `
            --hidden-import research_enhancements `
            --hidden-import research_ui `
            --hidden-import yomceph_theme `
            --hidden-import tkinter --hidden-import tkinter.ttk --hidden-import tkinter.filedialog --hidden-import tkinter.messagebox --hidden-import tkinter.simpledialog `
            --collect-all PIL `
            --collect-all pymupdf `
            --collect-all reportlab `
            --collect-all openpyxl `
            --add-data "desktop/assets/yomceph_logo.png;." `
            --add-data "desktop/assets/yomceph.ico;." `
            desktop/yomceph_desktop_v014.py

      - name: Cold-start packaged EXE
        shell: pwsh
        run: |
          $exe = Resolve-Path 'dist/YomCeph_Desktop/YomCeph_Desktop.exe'
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "YomCeph exited during cold start with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          $bytes=[IO.File]::ReadAllBytes($exe)
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'Missing MZ signature' }
          Get-FileHash $exe -Algorithm SHA256

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build bilingual installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-installer-v014 | Out-Null
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' desktop\YomCeph_Desktop_v014.iss
          $setup='dist-installer-v014/YomCeph_Desktop_Setup_v0.14.0_Classic_Research_Suite.exe'
          if (!(Test-Path $setup)) { throw 'Installer was not generated' }
          $bytes=[IO.File]::ReadAllBytes($setup)
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'Installer missing MZ signature' }
          Get-FileHash $setup -Algorithm SHA256
          Get-Item $setup | Format-List Name,Length,FullName

      - name: Package portable folder
        shell: pwsh
        run: Compress-Archive -Path dist\YomCeph_Desktop\* -DestinationPath dist-installer-v014\YomCeph_Desktop_v0.14.0_Classic_Research_Suite_Portable.zip -Force

      - name: Upload installer and portable build
        uses: actions/upload-artifact@v4
        with:
          name: YomCeph-Desktop-v0.14.0-Classic-Research-Suite-Windows-x64
          path: |
            dist-installer-v014/YomCeph_Desktop_Setup_v0.14.0_Classic_Research_Suite.exe
            dist-installer-v014/YomCeph_Desktop_v0.14.0_Classic_Research_Suite_Portable.zip
          if-no-files-found: error
