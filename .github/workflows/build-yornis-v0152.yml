name: Build Yornis v0.15.2 Cervical HiDPI Corrected
on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths: ['desktop/**','.github/workflows/build-yornis-v0152.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        shell: pwsh
        run: python -m pip install pillow pymupdf reportlab openpyxl pyinstaller pyzipper
      - name: Restore logo
        shell: pwsh
        run: |
          @'
          import base64,hashlib
          from pathlib import Path
          from PIL import Image
          hashes=['08e2c18c1229ae0db0cdb7162bf1866686da2a5302a32dabd5bea078defce43d','1c67f7b94c7cc957398b37d5d82aea88e848f44fc51bc07c326dc0c825a0a77d','1adcf93696d7732204c8c7f17fb9ba66c7f66fa7306dcf0bcdd3bcda6d9591e5','072cdae528a073d41065027dd6149311e30ab56ee1525c3188edd5ada4debd46','4ed235b0bc89c66d1e2d2d087432c8e01531276d01a143ef09fe8044038fff74','640864304af438d08e8894ab08e4d15496ce1bea09234d59702bad24ee14a05a','044111ef3f14609e29fce0ce13172414083e5dd1533074953ef38e1bbc18e036','50363e5da8e2ad83109563fb3213ba85f61d8e647fdc800a2e34759691952190','81351072f4506e5ef3aafe6b0831f8b77debe5b67cd94718dbf7ee7715234136','d8027243deb52973c3083ceb62e8fc21ad35c996e5e2e907f90d4536cb71b5c4','3353a967f7d02a37990d853206a985a151c391219c9966cb78e0aa0d018dda29','4e6283855be363989458f80e46515a3169aad708107222037821df5539831275']
          chunks=[]
          for i,h in enumerate(hashes):
              s=Path(f'desktop/assets/yornis_logo_chunk_{i:02d}.b64').read_text(encoding='utf-8').strip();assert hashlib.sha256(s.encode('ascii')).hexdigest()==h;chunks.append(s)
          raw=base64.b64decode(''.join(chunks),validate=True);assert hashlib.sha256(raw).hexdigest()=='076f10e95b384ef8da2caf98006d8c84ea43a3108275553516e0a2657bba68b9'
          Path('desktop/assets/yornis_logo.png').write_bytes(raw);Path('desktop/assets/yomceph_logo.png').write_bytes(raw)
          im=Image.open('desktop/assets/yornis_logo.png').convert('RGBA');assert im.size==(192,192);im.save('desktop/assets/yornis.ico',sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(192,192)])
          '@ | python -
      - name: Syntax and clinical audit
        shell: pwsh
        run: |
          Get-ChildItem desktop\yornis_*.py | ForEach-Object { python -m py_compile $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          @'
          import math,sys,tempfile
          from pathlib import Path
          sys.path.insert(0,'desktop')
          import classic_engine as e
          import research_protocol as rp
          import yornis_clinical_audit_v0151 as audit
          import yornis_cervical_v0152 as cv
          import yornis_alignment_v0152 as al
          from research_db import ResearchDB
          assert len(e.ANALYSES)==17,len(e.ANALYSES)
          assert len(e.MEASUREMENTS)==99,len(e.MEASUREMENTS)
          assert len(e.POINT_HELP)>=65,len(e.POINT_HELP)
          keys=[f'{m.analysis}::{m.name}' for m in e.MEASUREMENTS];assert len(keys)==len(set(keys))
          catalog=rp.analysis_catalog();assert set(catalog)==set(e.ANALYSES)
          assert {a for a in e.ANALYSES if not catalog[a]}=={'Sassouni','CVM C2–C4',al.ALIGNMENT_ANALYSIS}
          assert sum(map(len,catalog.values()))==99
          assert not [(m.analysis,m.name,p) for m in e.MEASUREMENTS for p in m.pts if p not in e.POINT_HELP]
          by={(m.analysis,m.name):m for m in e.MEASUREMENTS}
          assert by[('Burstone COGS','Convexidad N-A-Pg')].kind=='straight_dev'
          assert by[('Legan–Burstone',"Convexidad facial G'-Sn-Pg'")].kind=='straight_dev'
          assert by[('Cráneo-cervical','C0–C1')].pts==('C1sup','Occ','PNS')
          assert by[('Cráneo-cervical','C1–C2')].pts==('C1pi','C2pspin')
          pts={'A':(4.,1.),'B':(2.,-1.),'OcP':(0.,0.),'OcA':(10.,0.)};w=next(m for m in e.MEASUREMENTS if m.analysis=='Wits')
          v1=e.compute(w,pts,1.,'right');v2=e.compute(w,{k:(-x,y) for k,(x,y) in pts.items()},1.,'left');assert abs(v1-v2)<1e-9,(v1,v2)
          c1=e.signed_straight_deviation((0,0),(5,1),(10,0),(1,0));c2=e.signed_straight_deviation((0,0),(-5,1),(-10,0),(-1,0));assert abs(c1-c2)<1e-9
          lord=by[(cv.POSTURE_ANALYSIS,cv.POSTURE_MEASUREMENT)];assert lord.pts==cv.LORDOSIS_POINTS
          p={'C1 tub post':(0,0),'C1 tub ant':(10,8.390996),'C7 inf post':(0,20),'C7 inf ant':(10,20)}
          a=e.compute(lord,p,1.,'right');b=e.compute(lord,{k:(-x,y) for k,(x,y) in p.items()},1.,'left');assert 35<a<45 and abs(a-b)<1e-6,(a,b)
          assert 'referencia' in cv.posture_classification(a)[0].lower()
          canonical=[(('no','no','no','trapezoidal','trapezoidal'),1),(('si','no','no','trapezoidal','trapezoidal'),2),(('si','si','no','trapezoidal','horizontal'),3),(('si','si','si','horizontal','horizontal'),4),(('si','si','si','cuadrada','horizontal'),5),(('si','si','si','vertical','cuadrada'),6)]
          for args,stage in canonical: assert cv.classify_cvm(*args)['stage']==stage,(args,cv.classify_cvm(*args))
          assert cv.classify_cvm('no','si','no','trapezoidal','trapezoidal')['stage'] is None
          expected={'Lordosis normal':1,'Rectificación':2,'Cifosis':3,'Hiperlordosis':4}
          assert al.ALIGNMENT_CODEBOOK==expected
          for label,code in expected.items():
              r=al.classify_alignment(label);assert r['code']==code and r['label']==label,r
          assert al.classify_alignment('')['code'] is None
          lkey=f'{lord.analysis}::{lord.name}';rr=rp.compute_selected([lkey],p,None,side='right');assert rr and 35<rr[0]['value']<45,rr
          lin=next(m for m in e.MEASUREMENTS if m.unit=='mm');dummy={q:(float(i*10),float(i*3)) for i,q in enumerate(lin.pts)};lr=rp.compute_selected([f'{lin.analysis}::{lin.name}'],dummy,None,side='right');assert lr[0]['value'] is None and 'calibr' in lr[0]['interpretation'].lower()
          with tempfile.TemporaryDirectory() as td:
              db=ResearchDB(Path(td)/'a.sqlite3');audit._ensure_profile_side_column(db);sid=db.create_study('Audit');cid=db.add_case(sid,'A001');audit._set_profile_side(db,cid,'left');assert audit._profile_side(db,cid)=='left';cv._ensure_table(db);al._ensure_columns(db)
              with db.connect() as con:
                  cols={r[1] for r in con.execute('PRAGMA table_info(cervical_assessments)').fetchall()}
              assert {'lordosis_angle','cvm_stage','features_json','alignment_code','alignment_class','alignment_notes'}.issubset(cols)
          print('CERVICAL + C2-C4 ALIGNMENT AUDIT OK')
          '@ | python -
      - name: Capacity and GUI HiDPI
        shell: pwsh
        run: |
          @'
          import sys,tempfile,tkinter.font as tkfont
          from pathlib import Path
          sys.path.insert(0,'desktop')
          import research_stability_db_v0141,yornis_storage_v015,yornis_import_v015,yornis_theme,yornis_display_v0152 as disp
          from research_db import ResearchDB,now_iso
          research_stability_db_v0141.install();yornis_storage_v015.install();yornis_import_v015.install()
          assert yornis_theme.landmark_radius()==2
          with tempfile.TemporaryDirectory() as td:
              db=ResearchDB(Path(td)/'r.sqlite3');sid=db.create_study('Stress');db.set_random_seed(sid,42871);stamp=now_iso()
              with db.connect() as c:
                  for i in range(1,1001):c.execute('INSERT INTO cases(study_id,case_number,study_code,created_at,updated_at) VALUES(?,?,?,?,?)',(sid,i,f'S{i:04d}',stamp,stamp))
              assert db.count_cases(sid)==1000
              assert [r['id'] for r in db.list_cases(sid,random_order=True)]==[r['id'] for r in db.list_cases(sid,random_order=True)]
          from yornis_desktop_v015 import Launcher,research_app,APP_VERSION
          assert APP_VERSION.startswith('0.15.2')
          a=Launcher();a.withdraw();a.update_idletasks();assert 'Yornis' in a.title();assert float(a.tk.call('tk','scaling'))>0;assert 'Segoe UI' in tkfont.nametofont('TkDefaultFont',root=a).actual('family');a.destroy()
          r=research_app('es');r.withdraw();r.update_idletasks();assert hasattr(r,'profile_side_var');assert getattr(r,'_yornis_alignment_menu_v0152',False);r.destroy()
          print('CAPACITY + HIDPI + TOUCH GUI OK')
          '@ | python -
      - name: Build application
        shell: pwsh
        run: pyinstaller --noconfirm --clean --onedir --windowed --name Yornis --icon desktop/assets/yornis.ico --paths desktop --hidden-import classic_engine --hidden-import yomceph_desktop_v130_classic --hidden-import research_db --hidden-import research_protocol --hidden-import research_ui --hidden-import research_ui_compat --hidden-import research_enhancements --hidden-import research_stability_db_v0141 --hidden-import research_stability_ui_core_v0141 --hidden-import research_stability_ui_perf_v0141 --hidden-import research_stability_export_ui_v0141 --hidden-import yornis_theme --hidden-import yornis_storage_v015 --hidden-import yornis_import_v015 --hidden-import yornis_background_import_v015 --hidden-import yornis_research_controls_v015 --hidden-import yornis_ui_theme_v015 --hidden-import yornis_spss_v015 --hidden-import yornis_visual_report_v015 --hidden-import yornis_export_ui_v015 --hidden-import yornis_backup_v015 --hidden-import yornis_backup_ui_v015 --hidden-import yornis_clinical_audit_v0151 --hidden-import yornis_cervical_v0152 --hidden-import yornis_alignment_v0152 --hidden-import yornis_display_v0152 --collect-all PIL --collect-all pymupdf --collect-all reportlab --collect-all openpyxl --collect-all pyzipper --add-data "desktop/assets/yornis_logo.png;." --add-data "desktop/assets/yomceph_logo.png;." --add-data "desktop/assets/yornis.ico;." desktop/yornis_desktop_v015.py
      - name: Cold start
        shell: pwsh
        run: |
          $p=Start-Process -FilePath (Resolve-Path 'dist/Yornis/Yornis.exe') -PassThru; Start-Sleep 8; if($p.HasExited){throw 'Yornis exited during cold start'}; Stop-Process -Id $p.Id -Force
          $exe=Resolve-Path 'dist/Yornis/Yornis.exe';$bytes=[IO.File]::ReadAllBytes($exe);if($bytes[0]-ne 0x4D -or $bytes[1]-ne 0x5A){throw 'Missing MZ'};Get-FileHash $exe -Algorithm SHA256
      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          New-Item -ItemType Directory -Force -Path dist-installer-yornis | Out-Null
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' desktop\Yornis_v015.iss
          $setup='dist-installer-yornis/Yornis_Setup_v0.15.2_Cervical_HiDPI.exe';if(!(Test-Path $setup)){throw 'Installer missing'};$bytes=[IO.File]::ReadAllBytes($setup);if($bytes[0]-ne 0x4D -or $bytes[1]-ne 0x5A){throw 'Installer missing MZ'};Get-FileHash $setup -Algorithm SHA256
          Compress-Archive -Path dist\Yornis\* -DestinationPath dist-installer-yornis\Yornis_v0.15.2_Cervical_HiDPI_Portable.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Yornis-v0.15.2-Cervical-HiDPI-Windows-x64-corrected
          path: |
            dist-installer-yornis/Yornis_Setup_v0.15.2_Cervical_HiDPI.exe
            dist-installer-yornis/Yornis_v0.15.2_Cervical_HiDPI_Portable.zip
          if-no-files-found: error
