name: Build Yornis v0.15.8 Final Polish

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/build-yornis-v0158-final.yml'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencies
        shell: pwsh
        run: python -m pip install pillow pymupdf reportlab openpyxl pyinstaller pyzipper

      - name: Rebuild 512px branding
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          from PIL import Image
          import base64, hashlib, io
          parts = sorted(Path('desktop/assets').glob('yornis_logo_chunk_*.b64'))
          assert len(parts) == 12, len(parts)
          source = base64.b64decode(''.join(p.read_text(encoding='utf-8').strip() for p in parts), validate=True)
          assert hashlib.sha256(source).hexdigest() == '076f10e95b384ef8da2caf98006d8c84ea43a3108275553516e0a2657bba68b9'
          original = Image.open(io.BytesIO(source)).convert('RGBA')
          canvas = Image.new('RGBA', (512, 512), (255, 255, 255, 255))
          canvas.alpha_composite(original.resize((420, 420), Image.Resampling.LANCZOS), (46, 20))
          canvas.save('desktop/assets/yornis_logo.png')
          canvas.save('desktop/assets/yomceph_logo.png')
          canvas.save('desktop/assets/yornis.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          print('Yornis 512px branding OK')
          '@ | python -

      - name: Compile all desktop modules
        shell: pwsh
        run: |
          Get-ChildItem desktop\*.py | ForEach-Object {
            python -m py_compile $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Unit and regression tests
        shell: pwsh
        run: python -m unittest discover -s desktop/tests -p "test_*.py" -v

      - name: v0.15.8 final clinical and UI audit
        shell: pwsh
        run: |
          @'
          import sys
          sys.path.insert(0, 'desktop')
          import research_stability_db_v0141, yornis_storage_v015, yornis_import_v015, yornis_backup_v015
          research_stability_db_v0141.install(); yornis_storage_v015.install(); yornis_import_v015.install(); yornis_backup_v015.install()
          import yornis_audit_hardening_v0154 as hardening
          hardening.install_global()
          import yornis_evidence_v0155 as evidence
          evidence.install()
          import yornis_reference_help_v0156 as refs
          import yornis_virtual_assistant_v0157 as assistant
          import yornis_quality_ui_v0158 as quality
          import yornis_desktop_v0158 as app
          import yornis_theme, classic_engine as engine
          import yornis_cervical_v0152 as cervical
          refs.validate_tables()
          assert app.APP_VERSION.startswith('0.15.8')
          assert quality.QUALITY_VERSION == '0.15.8'
          assert len(refs.TABLES) == 17
          assert len(engine.MEASUREMENTS) == 102
          assert len(yornis_theme.theme_names()) == 8
          assert set(yornis_theme.theme_names()) == set(assistant.BIRD_PROFILES)
          assert any(x.kind == 'Tabla' for x in assistant.search_content('Steiner'))
          assert any(x.kind == 'Medición' for x in assistant.search_content('Steiner'))
          posture = [m for m in engine.MEASUREMENTS if m.analysis == cervical.POSTURE_ANALYSIS and m.name == cervical.POSTURE_MEASUREMENT]
          assert len(posture) == 1
          assert posture[0].lo is None and posture[0].hi is None
          assert '35–45' not in posture[0].norm_text
          airway = next(t for t in refs.TABLES if t['id'] == 'via_aerea')
          assert any(r[0] == 'McNamara superior · 6 años' and r[1] == '7.500 mm' for r in airway['rows'])
          assert not any('· 7 años' in r[0] for r in airway['rows'])
          print('YORNIS v0.15.8 FINAL AUDIT OK · 102 measurements · 17 tables · 8 assistants')
          '@ | python -

      - name: GUI HiDPI final smoke test
        shell: pwsh
        run: |
          @'
          import sys, tkinter.font as tkfont
          from pathlib import Path
          sys.path.insert(0, 'desktop')
          from yornis_desktop_v0158 import Launcher, research_app, APP_VERSION
          assert APP_VERSION.startswith('0.15.8')
          assert 'PerMonitorV2' in Path('desktop/yornis_windows.manifest').read_text(encoding='utf-8')
          launcher = Launcher(); launcher.withdraw(); launcher.update_idletasks()
          assert float(launcher.tk.call('tk','scaling')) > 0
          assert 'Segoe UI' in tkfont.nametofont('TkDefaultFont', root=launcher).actual('family')
          assert launcher.winfo_reqwidth() >= 1000
          assert len(launcher.palette_cards) == 8
          assert len(launcher.palette_photos) == 8
          launcher.destroy()
          research = research_app('es'); research.withdraw(); research.update_idletasks()
          assert hasattr(research, '_yornis_assistant_button_v0157')
          assert hasattr(research, 'profile_side_var') and hasattr(research, 'population_var')
          research.destroy()
          print('YORNIS v0.15.8 FINAL GUI + HiDPI OK')
          '@ | python -

      - name: Build application
        shell: pwsh
        run: >-
          pyinstaller --noconfirm --clean --onedir --windowed --name Yornis
          --icon desktop/assets/yornis.ico
          --manifest desktop/yornis_windows.manifest
          --version-file desktop/yornis_version_info_v0158.txt
          --paths desktop
          --hidden-import classic_engine --hidden-import yomceph_desktop_v130_classic
          --hidden-import research_db --hidden-import research_protocol --hidden-import research_ui --hidden-import research_ui_compat --hidden-import research_enhancements
          --hidden-import research_stability_db_v0141 --hidden-import research_stability_ui_core_v0141 --hidden-import research_stability_ui_perf_v0141 --hidden-import research_stability_export_ui_v0141
          --hidden-import yornis_theme --hidden-import yornis_storage_v015 --hidden-import yornis_import_v015 --hidden-import yornis_background_import_v015 --hidden-import yornis_research_controls_v015 --hidden-import yornis_ui_theme_v015
          --hidden-import yornis_spss_v015 --hidden-import yornis_visual_report_v015 --hidden-import yornis_export_ui_v015 --hidden-import yornis_backup_v015 --hidden-import yornis_backup_ui_v015
          --hidden-import yornis_clinical_audit_v0151 --hidden-import yornis_cervical_v0152 --hidden-import yornis_alignment_v0152 --hidden-import yornis_display_v0152 --hidden-import yornis_ceph_quality_v0153 --hidden-import yornis_audit_hardening_v0154
          --hidden-import yornis_reference_help_v0154 --hidden-import yornis_reference_help_v0154_all --hidden-import yornis_evidence_v0155 --hidden-import yornis_quality_ui_v0156 --hidden-import yornis_reference_help_v0156
          --hidden-import yornis_quality_ui_v0157 --hidden-import yornis_virtual_assistant_v0157 --hidden-import yornis_quality_ui_v0158
          --collect-all PIL --collect-all pymupdf --collect-all reportlab --collect-all openpyxl --collect-all pyzipper
          --add-data "desktop/assets/yornis_logo.png;." --add-data "desktop/assets/yomceph_logo.png;." --add-data "desktop/assets/yornis.ico;."
          desktop/yornis_desktop_v0158.py

      - name: Optional Authenticode signing
        shell: pwsh
        env:
          CERT_B64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERT_B64) -or [string]::IsNullOrWhiteSpace($env:CERT_PASSWORD)) {
            'UNSIGNED - no trusted code-signing certificate configured' | Set-Content -Encoding ascii signing-status.txt
            Write-Host 'No signing certificate configured; validation build remains unsigned.'
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'yornis-codesign.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_B64))
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse | Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $signtool) { throw 'signtool.exe not found' }
            & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:CERT_PASSWORD /tr https://timestamp.digicert.com /td SHA256 dist\Yornis\Yornis.exe
            if ($LASTEXITCODE -ne 0) { throw 'Yornis.exe signing failed' }
            & $signtool.FullName verify /pa /v dist\Yornis\Yornis.exe
            if ($LASTEXITCODE -ne 0) { throw 'Yornis.exe signature verification failed' }
            'SIGNED - Authenticode Valid' | Set-Content -Encoding ascii signing-status.txt
          } finally { if (Test-Path $pfx) { Remove-Item $pfx -Force } }

      - name: Cold start
        shell: pwsh
        run: |
          $p=Start-Process -FilePath (Resolve-Path 'dist/Yornis/Yornis.exe') -PassThru
          Start-Sleep 8
          if($p.HasExited){throw 'Yornis exited during cold start'}
          Stop-Process -Id $p.Id -Force
          $exe=Resolve-Path 'dist/Yornis/Yornis.exe'; $bytes=[IO.File]::ReadAllBytes($exe)
          if($bytes[0]-ne 0x4D -or $bytes[1]-ne 0x5A){throw 'Missing MZ'}
          Get-FileHash $exe -Algorithm SHA256

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          New-Item -ItemType Directory -Force -Path dist-installer-yornis | Out-Null
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' desktop\Yornis_v0158.iss
          $setup='dist-installer-yornis/Yornis_Setup_v0.15.8_Final_Polish_HiDPI.exe'
          if(!(Test-Path $setup)){throw 'Installer missing'}
          $bytes=[IO.File]::ReadAllBytes($setup)
          if($bytes[0]-ne 0x4D -or $bytes[1]-ne 0x5A){throw 'Installer missing MZ'}
          Compress-Archive -Path dist\Yornis\* -DestinationPath dist-installer-yornis\Yornis_v0.15.8_Final_Polish_HiDPI_Portable.zip -Force

      - name: Optional installer signing
        shell: pwsh
        env:
          CERT_B64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERT_B64) -or [string]::IsNullOrWhiteSpace($env:CERT_PASSWORD)) { exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP 'yornis-codesign.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_B64))
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse | Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $signtool) { throw 'signtool.exe not found' }
            $target='dist-installer-yornis\Yornis_Setup_v0.15.8_Final_Polish_HiDPI.exe'
            & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:CERT_PASSWORD /tr https://timestamp.digicert.com /td SHA256 $target
            if ($LASTEXITCODE -ne 0) { throw 'Installer signing failed' }
            & $signtool.FullName verify /pa /v $target
            if ($LASTEXITCODE -ne 0) { throw 'Installer signature verification failed' }
            'SIGNED - Authenticode Valid' | Set-Content -Encoding ascii signing-status.txt
          } finally { if (Test-Path $pfx) { Remove-Item $pfx -Force } }

      - name: Checksums
        shell: pwsh
        run: |
          $files=@('dist-installer-yornis/Yornis_Setup_v0.15.8_Final_Polish_HiDPI.exe','dist-installer-yornis/Yornis_v0.15.8_Final_Polish_HiDPI_Portable.zip')
          $out=@()
          foreach($f in $files){$h=Get-FileHash $f -Algorithm SHA256;$out += "$($h.Hash.ToLower())  $([IO.Path]::GetFileName($f))"}
          $out | Set-Content -Encoding ascii dist-installer-yornis\SHA256SUMS.txt
          Copy-Item signing-status.txt dist-installer-yornis\SIGNING_STATUS.txt -Force
          Get-Content dist-installer-yornis\SHA256SUMS.txt
          Get-Content dist-installer-yornis\SIGNING_STATUS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Yornis-v0.15.8-Final-Polish-Windows-x64
          path: |
            dist-installer-yornis/Yornis_Setup_v0.15.8_Final_Polish_HiDPI.exe
            dist-installer-yornis/Yornis_v0.15.8_Final_Polish_HiDPI_Portable.zip
            dist-installer-yornis/SHA256SUMS.txt
            dist-installer-yornis/SIGNING_STATUS.txt
          if-no-files-found: error
