name: Build Yom lateral skull analysis APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout standalone configuration
        uses: actions/checkout@v4
        with:
          path: standalone

      - name: Checkout audited radiographic source
        uses: actions/checkout@v4
        with:
          repository: yomismtz/Cefalometria-
          ref: 4fdbd4aed457aae8ec15e1a23a6ea9830092b3ac
          path: source

      - name: Prepare current tracing build
        working-directory: source
        run: python3 ci/prepare-test-build.py

      - name: Normalize tangent help
        working-directory: source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/cefalo/angulos/PointGuide.java')
          s = path.read_text(encoding='utf-8')
          s = s.replace(
              'GUIDE.put("Go", "Gonion (Go): punto construido sobre el ángulo mandibular, en la bisectriz formada por la tangente al borde posterior de la rama y la tangente al borde inferior del cuerpo mandibular.");',
              'GUIDE.put("Go", "Gonion (Go): punto construido sobre el ángulo mandibular. Para construirlo geométricamente trace 2 tangentes: una al borde posterior de la rama y otra al borde inferior del cuerpo mandibular. Cada tangente se define con 2 puntos de apoyo/contacto sobre su contorno; después se obtiene la bisectriz del ángulo formado por ambas tangentes y se localiza Go según el protocolo cefalométrico.");'
          )
          path.write_text(s, encoding='utf-8')
          PY

      - name: Apply clinical extensions and visual guides
        working-directory: source
        run: python3 ci/extend-clinical-build.py

      - name: Expand McGregor cranio-cervical guide
        working-directory: source
        run: python3 ci/augment-mcgregor-guide.py

      - name: Keep only calculable partial results
        working-directory: source
        run: python3 ci/fix-result-diagnostics.py

      - name: Apply final radiographic audit
        working-directory: source
        run: python3 ci/final-radiographic-audit.py

      - name: Refine radiographic assessment logic
        working-directory: source
        run: python3 ci/refine-radiographic-logic.py

      - name: Apply branding and calibration assistant
        working-directory: source
        run: python3 ci/mobile-brand-calibration.py

      - name: Apply exact fine adjustment
        working-directory: source
        run: python3 ci/mobile-fine-adjust.py

      - name: Refine per-landmark visual guides
        working-directory: source
        run: python3 ci/mobile-guide-polish.py

      - name: Generate responsive build and complementary angles
        working-directory: source
        run: python3 ci/mobile-responsive-layouts.py

      - name: Convert to dedicated comprehensive lateral-skull app
        working-directory: source
        run: python3 ../standalone/ci/standalone-lateral.py

      - name: Apply primary-source cephalometric audit
        working-directory: source
        run: python3 ../standalone/ci/primary-source-ceph-audit.py

      - name: Apply verified Ricketts, Steiner and Holdaway extensions
        working-directory: source
        run: python3 ../standalone/ci/primary-source-ceph-audit-extra.py

      - name: Integrate Burstone COGS and Legan-Burstone
        working-directory: source
        run: python3 ../standalone/ci/surgical-ceph-audit.py

      - name: Integrate Sassouni architectural analysis
        working-directory: source
        run: python3 ../standalone/ci/sassouni-architecture.py

      - name: Polish integrated reports and references
        working-directory: source
        run: python3 ../standalone/ci/final-integrated-ceph-polish.py

      - name: Apply v1.37 priority upgrades
        working-directory: source
        run: python3 ../standalone/ci/priority-upgrades-v137.py

      - name: Keep CVM skeletal maturation accessible
        working-directory: source
        run: python3 ../standalone/ci/restore-cvm-access.py

      - name: Apply distinct lateral-skull launcher icon
        working-directory: source
        run: python3 ../standalone/ci/apply-lateral-icon.py

      - name: Read app version
        id: app_version
        working-directory: source
        shell: bash
        run: |
          VERSION_NAME=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -n 1)
          VERSION_CODE=$(sed -n "s/.*versionCode \([0-9][0-9]*\).*/\1/p" app/build.gradle | head -n 1)
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Verify Android 16 target
        working-directory: source
        shell: bash
        run: |
          grep -Eq 'compileSdk[[:space:]]+36' app/build.gradle
          grep -Eq 'targetSdk[[:space:]]+36' app/build.gradle
          echo "compileSdk/targetSdk 36 confirmed"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run unit tests
        working-directory: source
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Run Android lint
        working-directory: source
        run: gradle --no-daemon :app:lintDebug :app:lintRelease

      - name: Build test APK and debug App Bundle
        working-directory: source
        run: gradle --no-daemon :app:assembleDebug :app:bundleDebug

      - name: Enable KVM for launch test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify APK really opens on Android
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r source/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.yomceph.cefalometrico
            adb shell am start -W -n com.yomceph.cefalometrico/com.cefalo.angulos.MainActivity
            sleep 4
            test -n "$(adb shell pidof com.yomceph.cefalometrico | tr -d '\r')"
            echo "Standalone lateral launcher remained alive after cold start"

      - name: Rename APK and AAB
        shell: bash
        run: |
          cp source/app/build/outputs/apk/debug/app-debug.apk "Yom-analisis-lateral-craneo-v${{ steps.app_version.outputs.name }}-${{ steps.app_version.outputs.code }}.apk"
          cp source/app/build/outputs/bundle/debug/app-debug.aab "Yom-analisis-lateral-craneo-v${{ steps.app_version.outputs.name }}-${{ steps.app_version.outputs.code }}-debug.aab"

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: Yom-Analisis-Lateral-Craneo-APK-v${{ steps.app_version.outputs.name }}-${{ steps.app_version.outputs.code }}
          path: Yom-analisis-lateral-craneo-v${{ steps.app_version.outputs.name }}-${{ steps.app_version.outputs.code }}.apk
          if-no-files-found: error

      - name: Upload debug AAB for Play pipeline validation
        uses: actions/upload-artifact@v4
        with:
          name: Yom-Analisis-Lateral-Craneo-AAB-v${{ steps.app_version.outputs.name }}-${{ steps.app_version.outputs.code }}
          path: Yom-analisis-lateral-craneo-v${{ steps.app_version.outputs.name }}-${{ steps.app_version.outputs.code }}-debug.aab
          if-no-files-found: error
