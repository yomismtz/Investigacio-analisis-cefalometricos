name: Build Yornis v0.15.9.2 Scroll + Bird Sounds

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/build-yornis-v01592.yml'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/build-yornis-v01592.yml'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencies
        shell: pwsh
        run: python -m pip install pillow pymupdf reportlab openpyxl pyinstaller pyzipper

      - name: Render bundled bird mascot images with Pillow
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          from PIL import Image, ImageDraw
          import math
          root = Path('desktop/assets/birds')
          root.mkdir(parents=True, exist_ok=True)
          birds = {
            'Agaporni': ('#5A246F','#17A8A2','#65D8BC','#A376D2','lovebird'),
            'Tucan': ('#D96816','#15AFA5','#F4C542','#5C4238','toucan'),
            'Pavorreal': ('#15517A','#138F85','#D6A82B','#573C83','peacock'),
            'Ninfa': ('#7A587F','#D8A82E','#E6A0AD','#9FA5A8','cockatiel'),
            'Faisan': ('#7B294B','#9B5A32','#B49B42','#6E7040','pheasant'),
            'Quetzal': ('#087D64','#0BA39B','#59CBA5','#BB3545','quetzal'),
            'Guacamaya_Roja': ('#B52632','#185CB7','#F0B82E','#8D2851','macaw'),
            'Guacamaya_Azul': ('#176BB4','#1AA6C7','#F2C54D','#31468D','macaw'),
          }
          for name,(head,body,wing,tail,kind) in birds.items():
            im=Image.new('RGBA',(512,512),(0,0,0,0)); d=ImageDraw.Draw(im)
            d.ellipse((130,205,400,465),fill=body,outline=head,width=12)
            d.polygon([(175,350),(35,475),(240,420)],fill=tail,outline=head)
            d.ellipse((120,45,395,325),fill=head,outline='#30202A',width=10)
            d.ellipse((145,230,365,435),fill=wing,outline=head,width=8)
            if kind=='peacock':
              for x in (190,255,320):
                d.line((255,100,x,20),fill=body,width=12); d.ellipse((x-20,0,x+20,40),fill=wing)
            elif kind=='cockatiel':
              d.polygon([(210,75),(190,0),(250,70),(285,0),(290,90)],fill=wing)
            elif kind=='quetzal':
              d.polygon([(220,365),(145,510),(260,405)],fill=tail)
              d.polygon([(275,365),(365,500),(310,385)],fill=body)
            elif kind=='toucan':
              d.polygon([(335,155),(500,205),(350,265)],fill=wing,outline='#30202A')
              d.polygon([(340,205),(490,210),(350,235)],fill='#30202A')
            elif kind=='macaw':
              d.ellipse((190,130,330,285),fill='#FFF7E7')
              for y in (165,205,245): d.arc((195,y-20,325,y+25),180,350,fill='#30202A',width=8)
            else:
              d.polygon([(225,65),(255,5),(280,70)],fill=tail)
            d.ellipse((285,145,325,185),fill='#201927'); d.ellipse((296,150,309,163),fill='white')
            d.polygon([(345,195),(425,230),(350,260)],fill=wing,outline='#30202A')
            d.arc((215,245,330,330),10,150,fill='#30202A',width=8)
            d.line((230,440,215,490),fill='#5B5361',width=12); d.line((320,440,335,490),fill='#5B5361',width=12)
            im.save(root/f'{name}.png',optimize=True)
          assert len(list(root.glob('*.png'))) == 8
          print('Eight offline mascot PNGs generated with Pillow')
          '@ | python -

      - name: Pre-render offline bird audio library
        shell: pwsh
        run: |
          @'
          import sys, wave
          from pathlib import Path
          sys.path.insert(0, 'desktop')
          import yornis_bird_signature_v01592 as audio
          names = ('Agaporni','Tucán','Pavorreal','Ninfa','Faisán','Quetzal','Guacamaya Roja','Guacamaya Azul')
          volumes = (20, 35, 50, 70, 90)
          out = Path('desktop/assets/bird_audio')
          out.mkdir(parents=True, exist_ok=True)
          for name in names:
              safe = ''.join(ch if ch.isalnum() else '_' for ch in name)
              for volume in volumes:
                  frames = audio.synthesize_signature(name, volume)
                  with wave.open(str(out / f'{safe}_{volume}.wav'), 'wb') as wav:
                      wav.setnchannels(1); wav.setsampwidth(2); wav.setframerate(audio.SAMPLE_RATE); wav.writeframes(frames)
          files = list(out.glob('*.wav'))
          assert len(files) == 40 and all(f.stat().st_size > 1000 for f in files)
          print('40 offline bird audio WAVs generated and validated')
          '@ | python -

      - name: Rebuild 512px branding
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          from PIL import Image
          import base64, hashlib, io
          parts = sorted(Path('desktop/assets').glob('yornis_logo_chunk_*.b64'))
          assert len(parts) == 12
          source = base64.b64decode(''.join(p.read_text(encoding='utf-8').strip() for p in parts), validate=True)
          assert hashlib.sha256(source).hexdigest() == '076f10e95b384ef8da2caf98006d8c84ea43a3108275553516e0a2657bba68b9'
          original = Image.open(io.BytesIO(source)).convert('RGBA')
          canvas = Image.new('RGBA', (512, 512), (255,255,255,255))
          canvas.alpha_composite(original.resize((420,420), Image.Resampling.LANCZOS), (46,20))
          canvas.save('desktop/assets/yornis_logo.png')
          canvas.save('desktop/assets/yomceph_logo.png')
          canvas.save('desktop/assets/yornis.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          '@ | python -

      - name: Compile all desktop modules
        shell: pwsh
        run: Get-ChildItem desktop\*.py | ForEach-Object { python -m py_compile $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }

      - name: Unit and regression tests
        shell: pwsh
        run: python -m unittest discover -s desktop/tests -p "test_*.py" -v

      - name: v0.15.9.2 scroll and sound audit
        shell: pwsh
        run: |
          @'
          import hashlib, sys
          sys.path.insert(0, 'desktop')
          import yornis_desktop_v01592 as app
          import yornis_bird_signature_v01592 as sounds
          import yornis_theme
          import yornis_reference_help_v0156 as refs
          import classic_engine as engine
          assert app.APP_VERSION.startswith('0.15.9.2')
          assert len(engine.MEASUREMENTS) == 102
          assert len(refs.TABLES) == 17
          assert set(yornis_theme.theme_names()) == set(sounds._SIGNATURES)
          digests=[]
          for name in yornis_theme.theme_names():
              frames = sounds.synthesize_signature(name, 35)
              assert len(frames) == int(sounds.SIGNATURE_DURATION * sounds.SAMPLE_RATE) * 2
              assert any(frames)
              digests.append(hashlib.sha256(frames).hexdigest())
          assert len(set(digests)) == 8
          print('YORNIS v0.15.9.2 SOUND + CLINICAL AUDIT OK')
          '@ | python -

      - name: GUI scrollbar + HiDPI smoke test
        shell: pwsh
        run: |
          @'
          import sys
          sys.path.insert(0, 'desktop')
          from yornis_desktop_v01592 import Launcher
          l=Launcher(); l.geometry('1000x620'); l.update()
          assert float(l.tk.call('tk','scaling')) > 0
          assert hasattr(l, '_scrollbar') and l._scrollbar.winfo_exists()
          assert hasattr(l, '_scroll_canvas') and l._scroll_canvas.winfo_exists()
          l.update_idletasks()
          bbox=l._scroll_canvas.bbox('all')
          assert bbox and (bbox[3]-bbox[1]) > l._scroll_canvas.winfo_height()
          before=l._scroll_canvas.yview()[0]
          l._scroll_canvas.yview_scroll(8, 'units'); l.update_idletasks()
          after=l._scroll_canvas.yview()[0]
          assert after > before
          assert hasattr(l, 'startup_sound_var')
          assert hasattr(l, 'startup_volume_var')
          assert len(l.palette_cards) == 8
          from yornis_bird_signature_v01592 import bundled_signature_path
          for bird in ('Agaporni','Tucán','Pavorreal','Ninfa','Faisán','Quetzal','Guacamaya Roja','Guacamaya Azul'):
              assert bundled_signature_path(bird, 35).name.endswith('_35.wav')
          from yornis_virtual_assistant_v0157 import make_avatar_photo
          for bird in ('Agaporni','Tucán','Pavorreal','Ninfa','Faisán','Quetzal','Guacamaya Roja','Guacamaya Azul'):
              image = make_avatar_photo(l, 64, bird)
              assert image.width() > 0 and image.height() > 0
          l.destroy()
          print('YORNIS v0.15.9.2 SCROLLBAR GUI OK')
          '@ | python -

      - name: Build application
        shell: pwsh
        run: >-
          pyinstaller --noconfirm --clean --onedir --windowed --name Yornis
          --icon desktop/assets/yornis.ico
          --manifest desktop/yornis_windows.manifest
          --version-file desktop/yornis_version_info_v01592.txt
          --paths desktop
          --hidden-import classic_engine --hidden-import yomceph_desktop_v130_classic
          --hidden-import research_db --hidden-import research_protocol --hidden-import research_ui --hidden-import research_ui_compat --hidden-import research_enhancements
          --hidden-import research_stability_db_v0141 --hidden-import research_stability_ui_core_v0141 --hidden-import research_stability_ui_perf_v0141 --hidden-import research_stability_export_ui_v0141
          --hidden-import yornis_theme --hidden-import yornis_storage_v015 --hidden-import yornis_import_v015 --hidden-import yornis_background_import_v015 --hidden-import yornis_research_controls_v015 --hidden-import yornis_ui_theme_v015
          --hidden-import yornis_spss_v015 --hidden-import yornis_visual_report_v015 --hidden-import yornis_export_ui_v015 --hidden-import yornis_backup_v015 --hidden-import yornis_backup_ui_v015
          --hidden-import yornis_clinical_audit_v0151 --hidden-import yornis_cervical_v0152 --hidden-import yornis_alignment_v0152 --hidden-import yornis_display_v0152 --hidden-import yornis_ceph_quality_v0153 --hidden-import yornis_audit_hardening_v0154
          --hidden-import yornis_reference_help_v0154 --hidden-import yornis_reference_help_v0154_all --hidden-import yornis_evidence_v0155 --hidden-import yornis_quality_ui_v0156 --hidden-import yornis_reference_help_v0156
          --hidden-import yornis_quality_ui_v0157 --hidden-import yornis_virtual_assistant_v0157 --hidden-import yornis_quality_ui_v0158 --hidden-import yornis_startup_audio_v0159 --hidden-import yornis_desktop_v0159 --hidden-import yornis_desktop_v01591 --hidden-import yornis_bird_signature_v01592
          --collect-all PIL --collect-all pymupdf --collect-all reportlab --collect-all openpyxl --collect-all pyzipper
          --add-data "desktop/assets/yornis_logo.png;." --add-data "desktop/assets/yomceph_logo.png;." --add-data "desktop/assets/yornis.ico;." --add-data "desktop/assets/birds;assets/birds" --add-data "desktop/assets/bird_audio;assets/bird_audio"
          desktop/yornis_desktop_v01592.py

      - name: Cold start
        shell: pwsh
        run: |
          $p=Start-Process -FilePath (Resolve-Path 'dist/Yornis/Yornis.exe') -PassThru
          Start-Sleep 8
          if($p.HasExited){throw 'Yornis exited during cold start'}
          Stop-Process -Id $p.Id -Force
          $bytes=[IO.File]::ReadAllBytes((Resolve-Path 'dist/Yornis/Yornis.exe'))
          if($bytes[0]-ne 0x4D -or $bytes[1]-ne 0x5A){throw 'Missing MZ'}

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          New-Item -ItemType Directory -Force -Path dist-installer-yornis | Out-Null
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' desktop\Yornis_v01592.iss
          $setup='dist-installer-yornis/Yornis_Setup_v0.15.9.2_Scroll_Bird_Signatures_HiDPI.exe'
          if(!(Test-Path $setup)){throw 'Installer missing'}
          Compress-Archive -Path dist\Yornis\* -DestinationPath dist-installer-yornis\Yornis_v0.15.9.2_Scroll_Bird_Signatures_HiDPI_Portable.zip -Force

      - name: Checksums
        shell: pwsh
        run: |
          $a=Get-FileHash dist-installer-yornis\Yornis_Setup_v0.15.9.2_Scroll_Bird_Signatures_HiDPI.exe -Algorithm SHA256
          $b=Get-FileHash dist-installer-yornis\Yornis_v0.15.9.2_Scroll_Bird_Signatures_HiDPI_Portable.zip -Algorithm SHA256
          "$($a.Hash.ToLower())  Yornis_Setup_v0.15.9.2_Scroll_Bird_Signatures_HiDPI.exe" | Out-File dist-installer-yornis\SHA256SUMS.txt -Encoding ascii
          "$($b.Hash.ToLower())  Yornis_v0.15.9.2_Scroll_Bird_Signatures_HiDPI_Portable.zip" | Out-File dist-installer-yornis\SHA256SUMS.txt -Encoding ascii -Append

      - uses: actions/upload-artifact@v4
        with:
          name: Yornis-v0.15.9.2-Scroll-Bird-Sounds-Windows-x64
          path: |
            dist-installer-yornis/Yornis_Setup_v0.15.9.2_Scroll_Bird_Signatures_HiDPI.exe
            dist-installer-yornis/Yornis_v0.15.9.2_Scroll_Bird_Signatures_HiDPI_Portable.zip
            dist-installer-yornis/SHA256SUMS.txt


      - name: Publish stable release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @'
          Yornis v0.15.9.2 · Individual Flow

          - Caso individual: análisis → medidas/ángulos → puntos.
          - Interfaz refinada con tarjetas, chips y mejor jerarquía visual.
          - Editor/Publisher: Yomira Salgado Martínez.
          - 8 asistentes-ave y firmas sonoras.
          - 102 mediciones y 17 tablas de referencia.
          - Fórmulas, geometría y referencias clínicas preservadas.
          '@ | Set-Content -Encoding utf8 release-notes.md

          $tag='v0.15.9.2'
          $setup='dist-installer-yornis/Yornis_Setup_v0.15.9.2_Scroll_Bird_Signatures_HiDPI.exe'
          $portable='dist-installer-yornis/Yornis_v0.15.9.2_Scroll_Bird_Signatures_HiDPI_Portable.zip'
          $sums='dist-installer-yornis/SHA256SUMS.txt'

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $setup $portable $sums --clobber
            gh release edit $tag --title "Yornis v0.15.9.2 · Individual Flow" --notes-file release-notes.md --latest
          } else {
            gh release create $tag $setup $portable $sums --target $env:GITHUB_SHA --title "Yornis v0.15.9.2 · Individual Flow" --notes-file release-notes.md --latest
          }
