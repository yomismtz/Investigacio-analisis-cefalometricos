name: Build Yornis v0.16.3 · Original Bird Recordings and Offline Audio
# v0.16.6 calibration, image-identity and viewport regression hardening

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/build-yornis-v01592.yml'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/build-yornis-v01592.yml'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencies
        shell: pwsh
        run: python -m pip install pillow pymupdf reportlab openpyxl pyinstaller pyzipper ttkbootstrap==2.2.7 imageio-ffmpeg numpy

      - name: Render versioned SVG bird mascots to transparent PNGs
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import fitz
          from PIL import Image
          root = Path('desktop/assets/birds')
          expected = {'Agaporni','Tucan','Pavorreal','Ninfa','Faisan','Quetzal','Guacamaya_Roja','Guacamaya_Azul','Búho','Colibrí'}
          sources = {p.stem: p for p in root.glob('*.svg')}
          assert set(sources) == expected, f'Missing or extra SVG mascots: {sorted(set(sources) ^ expected)}'
          for name, source in sources.items():
              document = fitz.open(stream=source.read_bytes(), filetype='svg')
              page = document[0]
              pixmap = page.get_pixmap(matrix=fitz.Matrix(3, 3), alpha=True)
              image = Image.frombytes('RGBA', (pixmap.width, pixmap.height), pixmap.samples)
              alpha_min, alpha_max = image.getchannel('A').getextrema()
              assert alpha_min == 0 and alpha_max > 0, f'{name}: expected genuine transparent pixels'
              image.save(root / f'{name}.png', optimize=True)
          rendered = list(root.glob('*.png'))
          assert len(rendered) == 10
          print('Ten repository SVG mascots rendered to transparent PNGs')
          '@ | python -

      - name: Convert all ten uploaded MP3 recordings into offline WAV libraries
        shell: pwsh
        run: |
          @'
          from __future__ import annotations
          import json, subprocess, wave
          from pathlib import Path
          import numpy as np
          from imageio_ffmpeg import get_ffmpeg_exe

          root = Path('desktop/assets')
          full_dir = root / 'bird_audio'
          startup_dir = root / 'bird_startup_audio'
          decoded_dir = Path('build-audio-decoded')
          rate = 44100
          volumes = (20, 35, 50, 70, 90)
          max_startup_seconds = 2.8
          recordings = {
              'Agaporni': 'agaporni.mp3',
              'Tucán': 'tucan.mp3',
              'Pavorreal': 'pavo real.mp3',
              'Ninfa': 'ninfa.mp3',
              'Faisán': 'faisan.mp3',
              'Quetzal': 'quetzal.mp3',
              'Guacamaya Roja': 'guacamaya roja.mp3',
              'Guacamaya Azul': 'guacamayo azul.mp3',
              'Búho': 'buho real.mp3',
              'Colibrí': 'colibri.mp3',
          }
          ffmpeg = get_ffmpeg_exe()
          full_dir.mkdir(parents=True, exist_ok=True)
          startup_dir.mkdir(parents=True, exist_ok=True)
          decoded_dir.mkdir(parents=True, exist_ok=True)

          def decode_mp3(source: Path, target: Path) -> None:
              subprocess.run([
                  ffmpeg, '-hide_banner', '-loglevel', 'error', '-y',
                  '-i', str(source), '-map', '0:a:0', '-vn',
                  '-ac', '1', '-ar', str(rate), '-c:a', 'pcm_s16le', str(target)
              ], check=True)

          def read_samples(path: Path) -> np.ndarray:
              with wave.open(str(path), 'rb') as wav:
                  assert wav.getnchannels() == 1 and wav.getsampwidth() == 2
                  assert wav.getframerate() == rate
                  return np.frombuffer(wav.readframes(wav.getnframes()), dtype='<i2').astype(np.float32)

          def write_wav(path: Path, samples: np.ndarray) -> None:
              pcm = np.clip(np.rint(samples), -32768, 32767).astype('<i2')
              with wave.open(str(path), 'wb') as wav:
                  wav.setnchannels(1)
                  wav.setsampwidth(2)
                  wav.setframerate(rate)
                  wav.writeframes(pcm.tobytes())

          def fade_edges(samples: np.ndarray, fade_ms: float = 12.0) -> np.ndarray:
              samples = samples.copy()
              n = min(int(rate * fade_ms / 1000), len(samples) // 2)
              if n:
                  ramp = np.linspace(0.0, 1.0, n, endpoint=True, dtype=np.float32)
                  samples[:n] *= ramp
                  samples[-n:] *= ramp[::-1]
              return samples

          def highest_energy_clip(samples: np.ndarray) -> np.ndarray:
              length = min(len(samples), int(rate * max_startup_seconds))
              if length >= len(samples):
                  return samples.copy()
              stride = max(1, rate // 10)
              squared = np.square(samples.astype(np.float64))
              cumulative = np.concatenate(([0.0], np.cumsum(squared)))
              starts = np.arange(0, len(samples) - length + 1, stride, dtype=np.int64)
              energies = cumulative[starts + length] - cumulative[starts]
              start = int(starts[int(np.argmax(energies))])
              return samples[start:start + length].copy()

          manifest = {
              'product': 'Yornis', 'version': '0.16.3', 'offline': True,
              'source': 'Ten user-uploaded MP3 recordings in desktop/assets',
              'format': 'WAV PCM signed 16-bit mono 44100 Hz',
              'palette_audio': 'Full uploaded recording',
              'startup_audio': 'Highest-energy excerpt up to 2.8 seconds',
              'volume_levels': list(volumes), 'birds': {}
          }

          for bird, filename in recordings.items():
              source = root / filename
              assert source.is_file() and source.stat().st_size > 1000, f'Missing audio source: {source}'
              decoded = decoded_dir / f'{bird}.wav'
              decode_mp3(source, decoded)
              samples = read_samples(decoded)
              peak = float(np.max(np.abs(samples)))
              assert peak > 100.0, f'Empty or silent recording: {source}'
              master = samples * (0.92 * 32767.0 / peak)
              startup_master = fade_edges(highest_energy_clip(master))
              safe = ''.join(ch if ch.isalnum() else '_' for ch in bird)
              manifest['birds'][bird] = {
                  'source_file': filename,
                  'duration_seconds': round(len(master) / rate, 3),
                  'startup_clip_seconds': round(len(startup_master) / rate, 3),
                  'peak_normalized': 0.92,
              }
              for volume in volumes:
                  factor = volume / 100.0
                  write_wav(full_dir / f'{safe}_{volume}.wav', fade_edges(master * factor))
                  write_wav(startup_dir / f'{safe}_{volume}.wav', startup_master * factor)

          for folder in (full_dir, startup_dir):
              files = list(folder.glob('*.wav'))
              assert len(files) == 50, f'{folder}: expected 50 files, found {len(files)}'
              for path in files:
                  with wave.open(str(path), 'rb') as wav:
                      assert wav.getnchannels() == 1 and wav.getsampwidth() == 2
                      assert wav.getframerate() == rate and wav.getnframes() > rate // 5
          (root / 'bird_audio_manifest_v0163.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          print('TEN ORIGINAL MP3 RECORDINGS -> 50 FULL PALETTE WAVS + 50 SHORT STARTUP WAVS')
          print('All audio decoded, volume-scaled, validated and ready for offline packaging')
          '@ | python -

      - name: Rebuild 512px Yornis branding
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          from PIL import Image
          import base64, hashlib, io
          parts = sorted(Path('desktop/assets').glob('yornis_logo_chunk_*.b64'))
          assert len(parts) == 12
          source = base64.b64decode(''.join(p.read_text(encoding='utf-8').strip() for p in parts), validate=True)
          assert hashlib.sha256(source).hexdigest() == '076f10e95b384ef8da2caf98006d8c84ea43a3108275553516e0a2657bba68b9'
          original = Image.open(io.BytesIO(source)).convert('RGBA')
          canvas = Image.new('RGBA', (512, 512), (255,255,255,255))
          canvas.alpha_composite(original.resize((420,420), Image.Resampling.LANCZOS), (46,20))
          canvas.save('desktop/assets/yornis_logo.png')
          canvas.save('desktop/assets/yornis.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          '@ | python -

      - name: Compile all desktop modules
        shell: pwsh
        run: Get-ChildItem desktop\*.py | ForEach-Object { python -m py_compile $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }

      - name: Unit and regression tests (required)
        shell: pwsh
        run: python -m unittest discover -s desktop/tests -p "test_*.py" -v

      - name: v0.16.3 branding, guided calibration and clinical audit
        shell: pwsh
        run: |
          @'
          import hashlib, sys
          sys.path.insert(0, 'desktop')
          import yornis_desktop_v01592 as app
          import yornis_bird_signature_v01592 as sounds
          import yornis_startup_audio_v0159 as startup_sounds
          import yornis_theme
          import yornis_branding_v0161 as branding
          import research_db
          import yornis_modern_ui_v0160 as modern_ui
          import yornis_reference_help_v0156 as refs
          import classic_engine as engine
          assert app.APP_VERSION.startswith('0.16.3')
          assert research_db.APP_DIR.name == 'Yornis'
          assert research_db.DB_PATH.name == 'yornis_research.sqlite3'
          check_source = "class YomCephClassic: pass\nlabel = 'YOMCEPH'"
          branded_source = branding.rebrand_classic_source(check_source)
          assert 'class YomCephClassic' in branded_source and "'YORNIS'" in branded_source
          cal_title, cal_prompt = branding.calibration_dialog_copy('Calibrar mm', 'Distancia real entre puntos')
          assert cal_title == 'Calibrar radiografía · Yornis'
          assert 'MILÍMETROS REALES' in cal_prompt and 'primer extremo' in cal_prompt and 'segundo extremo' in cal_prompt
          assert len(engine.MEASUREMENTS) == 102
          assert len(refs.TABLES) == 17
          assert modern_ui.modern_backend_available()
          import wave
          from pathlib import Path
          assert set(yornis_theme.theme_names()) == set(sounds.BIRD_AUDIO_FILES)
          assert len(sounds.BIRD_AUDIO_FILES) == 10
          for name, filename in sounds.BIRD_AUDIO_FILES.items():
              source = Path('desktop/assets') / filename
              assert source.is_file() and source.stat().st_size > 1000
              for volume in sounds.VOLUME_LEVELS:
                  full = sounds.bundled_signature_path(name, volume)
                  short = startup_sounds.bundled_wav_path(name, volume)
                  assert full.is_file() and short.is_file()
                  for audio_path in (full, short):
                      with wave.open(str(audio_path), 'rb') as wav:
                          assert wav.getnchannels() == 1 and wav.getsampwidth() == 2
                          assert wav.getframerate() == sounds.SAMPLE_RATE
                          assert wav.getnframes() > sounds.SAMPLE_RATE // 5
          assert len(list(Path('desktop/assets/bird_audio').glob('*.wav'))) == 50
          assert len(list(Path('desktop/assets/bird_startup_audio').glob('*.wav'))) == 50
          print('YORNIS v0.16.3 TEN ORIGINAL RECORDINGS + OFFLINE AUDIO + CLINICAL AUDIT OK')
          '@ | python -

      - name: GUI scrollbar + HiDPI smoke test
        shell: pwsh
        run: |
          @'
          import sys
          sys.path.insert(0, 'desktop')
          from yornis_desktop_v01592 import Launcher
          import yornis_modern_ui_v0160 as modern_ui
          import yornis_theme
          l=Launcher(); l.geometry('1000x620'); l.update()
          assert modern_ui.active_widget_theme(l) in ('bootstrap-light', 'clam')
          for bird, palette in yornis_theme.THEMES.items():
              yornis_theme.apply_theme(bird, persist=True)
              modern_ui.apply_modern_styles(l)
              assert modern_ui.primary_action_color(l) == palette['primary']
          yornis_theme.apply_theme('Agaporni', persist=True)
          modern_ui.apply_modern_styles(l)
          assert float(l.tk.call('tk','scaling')) > 0
          assert hasattr(l, '_scrollbar') and l._scrollbar.winfo_exists()
          assert hasattr(l, '_scroll_canvas') and l._scroll_canvas.winfo_exists()
          l.update_idletasks()
          bbox=l._scroll_canvas.bbox('all')
          assert bbox and (bbox[3]-bbox[1]) > l._scroll_canvas.winfo_height()
          before=l._scroll_canvas.yview()[0]
          l._scroll_canvas.yview_scroll(8, 'units'); l.update_idletasks()
          after=l._scroll_canvas.yview()[0]
          assert after > before
          assert hasattr(l, 'startup_sound_var')
          assert hasattr(l, 'startup_volume_var')
          assert len(l.palette_cards) == 10
          from yornis_bird_signature_v01592 import bundled_signature_path
          from yornis_startup_audio_v0159 import bundled_wav_path
          for bird in ('Agaporni','Tucán','Pavorreal','Ninfa','Faisán','Quetzal','Guacamaya Roja','Guacamaya Azul','Búho','Colibrí'):
              for volume in (20, 35, 50, 70, 90):
                  assert bundled_signature_path(bird, volume).is_file()
                  assert bundled_wav_path(bird, volume).is_file()
          from yornis_virtual_assistant_v0157 import make_avatar_photo
          for bird in ('Agaporni','Tucán','Pavorreal','Ninfa','Faisán','Quetzal','Guacamaya Roja','Guacamaya Azul','Búho','Colibrí'):
              image = make_avatar_photo(l, 64, bird)
              assert image.width() > 0 and image.height() > 0
          l.destroy()
          print('YORNIS v0.16.3 TEN PALETTES + OFFLINE GUI OK')
          '@ | python -

      - name: Build application
        shell: pwsh
        run: >-
          pyinstaller --noconfirm --clean --onedir --windowed --name Yornis
          --icon desktop/assets/yornis.ico
          --manifest desktop/yornis_windows.manifest
          --version-file desktop/yornis_version_info_v01592.txt
          --paths desktop
          --hidden-import classic_engine --hidden-import yomceph_desktop_v130_classic
          --hidden-import research_db --hidden-import research_protocol --hidden-import research_ui --hidden-import research_ui_compat --hidden-import research_enhancements
          --hidden-import research_stability_db_v0141 --hidden-import research_stability_ui_core_v0141 --hidden-import research_stability_ui_perf_v0141 --hidden-import research_stability_export_ui_v0141
          --hidden-import yornis_theme --hidden-import yornis_storage_v015 --hidden-import yornis_import_v015 --hidden-import yornis_background_import_v015 --hidden-import yornis_research_controls_v015 --hidden-import yornis_ui_theme_v015
          --hidden-import yornis_spss_v015 --hidden-import yornis_visual_report_v015 --hidden-import yornis_export_ui_v015 --hidden-import yornis_backup_v015 --hidden-import yornis_backup_ui_v015
          --hidden-import yornis_clinical_audit_v0151 --hidden-import yornis_cervical_v0152 --hidden-import yornis_alignment_v0152 --hidden-import yornis_display_v0152 --hidden-import yornis_ceph_quality_v0153 --hidden-import yornis_audit_hardening_v0154
          --hidden-import yornis_reference_help_v0154 --hidden-import yornis_reference_help_v0154_all --hidden-import yornis_evidence_v0155 --hidden-import yornis_quality_ui_v0156 --hidden-import yornis_reference_help_v0156
          --hidden-import yornis_quality_ui_v0157 --hidden-import yornis_virtual_assistant_v0157 --hidden-import yornis_quality_ui_v0158 --hidden-import yornis_startup_audio_v0159 --hidden-import yornis_desktop_v0159 --hidden-import yornis_desktop_v01591 --hidden-import yornis_bird_signature_v01592 --hidden-import yornis_modern_ui_v0160 --hidden-import yornis_calibration_gate_v0164
          --collect-all PIL --collect-all pymupdf --collect-all reportlab --collect-all openpyxl --collect-all pyzipper --collect-all ttkbootstrap
          --add-data "desktop/assets/yornis_logo.png;." --add-data "desktop/assets/yornis.ico;." --add-data "desktop/assets/birds;assets/birds" --add-data "desktop/assets/bird_audio;assets/bird_audio" --add-data "desktop/assets/bird_startup_audio;assets/bird_startup_audio"
          desktop/yornis_desktop_v01592.py

      - name: Cold start with application outbound internet blocked
        shell: pwsh
        run: |
          $exe=(Resolve-Path 'dist/Yornis/Yornis.exe').Path
          $rule='Yornis-CI-Offline-Cold-Start'
          try {
            New-NetFirewallRule -DisplayName $rule -Direction Outbound -Program $exe -Action Block -Profile Any | Out-Null
            $p=Start-Process -FilePath $exe -PassThru
            Start-Sleep 8
            if($p.HasExited){throw 'Yornis exited during offline cold start'}
            Stop-Process -Id $p.Id -Force
            $bytes=[IO.File]::ReadAllBytes($exe)
            if($bytes[0]-ne 0x4D -or $bytes[1]-ne 0x5A){throw 'Missing MZ'}
          } finally {
            Get-NetFirewallRule -DisplayName $rule -ErrorAction SilentlyContinue | Remove-NetFirewallRule -ErrorAction SilentlyContinue
          }

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          New-Item -ItemType Directory -Force -Path dist-installer-yornis | Out-Null
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' desktop\Yornis_v01592.iss
          $setup='dist-installer-yornis/Yornis_Setup_v0.16.3_Modern_Interface_Offline.exe'
          if(!(Test-Path $setup)){throw 'Installer missing'}
          Compress-Archive -Path dist\Yornis\* -DestinationPath dist-installer-yornis\Yornis_v0.16.3_Modern_Interface_Offline_Portable.zip -Force

      - name: Checksums
        shell: pwsh
        run: |
          $a=Get-FileHash dist-installer-yornis\Yornis_Setup_v0.16.3_Modern_Interface_Offline.exe -Algorithm SHA256
          $b=Get-FileHash dist-installer-yornis\Yornis_v0.16.3_Modern_Interface_Offline_Portable.zip -Algorithm SHA256
          "$($a.Hash.ToLower())  Yornis_Setup_v0.16.3_Modern_Interface_Offline.exe" | Out-File dist-installer-yornis\SHA256SUMS.txt -Encoding ascii
          "$($b.Hash.ToLower())  Yornis_v0.16.3_Modern_Interface_Offline_Portable.zip" | Out-File dist-installer-yornis\SHA256SUMS.txt -Encoding ascii -Append

      - uses: actions/upload-artifact@v4
        with:
          name: Yornis-v0.16.3-Modern-Interface-Offline-Windows-x64
          path: |
            dist-installer-yornis/Yornis_Setup_v0.16.3_Modern_Interface_Offline.exe
            dist-installer-yornis/Yornis_v0.16.3_Modern_Interface_Offline_Portable.zip
            dist-installer-yornis/SHA256SUMS.txt


      - name: Publish stable release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @'
          Yornis v0.16.3 · Identidad + calibración guiada

          - Interfaz modernizada con ttkbootstrap 2.2.7.
          - Botones, controles, tablas, pestañas y campos con estilo plano y espaciado moderno.
          - Las diez paletas de aves mantienen sus colores y actualizan los controles en tiempo real.
          - Sistema visual aplicado al lanzador, caso individual e investigación.
          - 102 mediciones y 17 tablas de referencia conservadas.
          - Calibración por radiografía y control de confianza de landmarks conservados.
          - Diez grabaciones originales de aves, con sonido completo al cambiar de paleta y fragmentos cortos de inicio, incluidos para uso sin conexión.
          - Fórmulas, geometría, base de datos y lógica clínica sin cambios.
          '@ | Set-Content -Encoding utf8 release-notes.md

          $tag='v0.16.3'
          $setup='dist-installer-yornis/Yornis_Setup_v0.16.3_Modern_Interface_Offline.exe'
          $portable='dist-installer-yornis/Yornis_v0.16.3_Modern_Interface_Offline_Portable.zip'
          $sums='dist-installer-yornis/SHA256SUMS.txt'

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $setup $portable $sums --clobber
            gh release edit $tag --title "Yornis v0.16.3 · Identidad + calibración guiada" --notes-file release-notes.md --latest
          } else {
            gh release create $tag $setup $portable $sums --target $env:GITHUB_SHA --title "Yornis v0.16.3 · Identidad + calibración guiada" --notes-file release-notes.md --latest
          }
