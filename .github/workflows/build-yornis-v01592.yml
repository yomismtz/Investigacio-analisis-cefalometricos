name: Build Yornis v0.16.2 · Owl + Hummingbird Palettes and Offline Sound

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/build-yornis-v01592.yml'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/build-yornis-v01592.yml'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencies
        shell: pwsh
        run: python -m pip install pillow pymupdf reportlab openpyxl pyinstaller pyzipper ttkbootstrap==2.2.7

      - name: Render versioned SVG bird mascots to transparent PNGs
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import fitz
          from PIL import Image
          root = Path('desktop/assets/birds')
          expected = {'Agaporni','Tucan','Pavorreal','Ninfa','Faisan','Quetzal','Guacamaya_Roja','Guacamaya_Azul','Búho','Colibrí'}
          sources = {p.stem: p for p in root.glob('*.svg')}
          assert set(sources) == expected, f'Missing or extra SVG mascots: {sorted(set(sources) ^ expected)}'
          for name, source in sources.items():
              document = fitz.open(stream=source.read_bytes(), filetype='svg')
              page = document[0]
              pixmap = page.get_pixmap(matrix=fitz.Matrix(3, 3), alpha=True)
              image = Image.frombytes('RGBA', (pixmap.width, pixmap.height), pixmap.samples)
              alpha_min, alpha_max = image.getchannel('A').getextrema()
              assert alpha_min == 0 and alpha_max > 0, f'{name}: expected genuine transparent pixels'
              image.save(root / f'{name}.png', optimize=True)
          rendered = list(root.glob('*.png'))
          assert len(rendered) == 10
          print('Ten repository SVG mascots rendered to transparent PNGs')
          '@ | python -

      - name: Pre-render offline bird audio libraries
        shell: pwsh
        run: |
          @'
          import sys, wave
          from pathlib import Path
          sys.path.insert(0, 'desktop')
          import yornis_bird_signature_v01592 as signatures
          import yornis_startup_audio_v0159 as startup
          names = ('Agaporni','Tucán','Pavorreal','Ninfa','Faisán','Quetzal','Guacamaya Roja','Guacamaya Azul','Búho','Colibrí')
          volumes = (20, 35, 50, 70, 90)
          destinations = (
              (signatures, Path('desktop/assets/bird_audio'), 'synthesize_signature'),
              (startup, Path('desktop/assets/bird_startup_audio'), 'synthesize_chorus'),
          )
          total = 0
          for module, out, function_name in destinations:
              out.mkdir(parents=True, exist_ok=True)
              synthesize = getattr(module, function_name)
              for name in names:
                  safe = ''.join(ch if ch.isalnum() else '_' for ch in name)
                  for volume in volumes:
                      frames = synthesize(name, volume)
                      target = out / f'{safe}_{volume}.wav'
                      with wave.open(str(target), 'wb') as wav:
                          wav.setnchannels(1)
                          wav.setsampwidth(2)
                          wav.setframerate(module.SAMPLE_RATE)
                          wav.writeframes(frames)
              files = list(out.glob('*.wav'))
              assert len(files) == 50 and all(p.stat().st_size > 1000 for p in files)
              total += len(files)
          assert total == 100
          print('100 offline bird WAVs generated and validated before packaging')
          '@ | python -

      - name: Rebuild 512px Yornis branding
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          from PIL import Image
          import base64, hashlib, io
          parts = sorted(Path('desktop/assets').glob('yornis_logo_chunk_*.b64'))
          assert len(parts) == 12
          source = base64.b64decode(''.join(p.read_text(encoding='utf-8').strip() for p in parts), validate=True)
          assert hashlib.sha256(source).hexdigest() == '076f10e95b384ef8da2caf98006d8c84ea43a3108275553516e0a2657bba68b9'
          original = Image.open(io.BytesIO(source)).convert('RGBA')
          canvas = Image.new('RGBA', (512, 512), (255,255,255,255))
          canvas.alpha_composite(original.resize((420,420), Image.Resampling.LANCZOS), (46,20))
          canvas.save('desktop/assets/yornis_logo.png')
          canvas.save('desktop/assets/yornis.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          '@ | python -

      - name: Compile all desktop modules
        shell: pwsh
        run: Get-ChildItem desktop\*.py | ForEach-Object { python -m py_compile $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }

      - name: Unit and regression tests
        shell: pwsh
        run: python -m unittest discover -s desktop/tests -p "test_*.py" -v

      - name: v0.16.2 branding, guided calibration and clinical audit
        shell: pwsh
        run: |
          @'
          import hashlib, sys
          sys.path.insert(0, 'desktop')
          import yornis_desktop_v01592 as app
          import yornis_bird_signature_v01592 as sounds
          import yornis_startup_audio_v0159 as startup_sounds
          import yornis_theme
          import yornis_branding_v0161 as branding
          import research_db
          import yornis_modern_ui_v0160 as modern_ui
          import yornis_reference_help_v0156 as refs
          import classic_engine as engine
          assert app.APP_VERSION.startswith('0.16.2')
          assert research_db.APP_DIR.name == 'Yornis'
          assert research_db.DB_PATH.name == 'yornis_research.sqlite3'
          check_source = "class YomCephClassic: pass\nlabel = 'YOMCEPH'"
          branded_source = branding.rebrand_classic_source(check_source)
          assert 'class YomCephClassic' in branded_source and "'YORNIS'" in branded_source
          cal_title, cal_prompt = branding.calibration_dialog_copy('Calibrar mm', 'Distancia real entre puntos')
          assert cal_title == 'Calibrar radiografía · Yornis'
          assert 'MILÍMETROS REALES' in cal_prompt and 'primer extremo' in cal_prompt and 'segundo extremo' in cal_prompt
          assert len(engine.MEASUREMENTS) == 102
          assert len(refs.TABLES) == 17
          assert modern_ui.modern_backend_available()
          assert set(yornis_theme.theme_names()) == set(sounds._SIGNATURES)
          digests=[]
          for name in yornis_theme.theme_names():
              frames = sounds.synthesize_signature(name, 35)
              assert len(frames) == int(sounds.SIGNATURE_DURATION * sounds.SAMPLE_RATE) * 2
              assert any(frames)
              digests.append(hashlib.sha256(frames).hexdigest())
              assert sounds.bundled_signature_path(name, 35).is_file()
              assert startup_sounds.bundled_wav_path(name, 35).is_file()
          assert len(set(digests)) == 10
          assert len(list(__import__('pathlib').Path('desktop/assets/bird_audio').glob('*.wav'))) == 50
          assert len(list(__import__('pathlib').Path('desktop/assets/bird_startup_audio').glob('*.wav'))) == 50
          print('YORNIS v0.16.2 TEN PALETTES + OFFLINE SOUND PROFILES + CLINICAL AUDIT OK')
          '@ | python -

      - name: GUI scrollbar + HiDPI smoke test
        shell: pwsh
        run: |
          @'
          import sys
          sys.path.insert(0, 'desktop')
          from yornis_desktop_v01592 import Launcher
          import yornis_modern_ui_v0160 as modern_ui
          import yornis_theme
          l=Launcher(); l.geometry('1000x620'); l.update()
          assert modern_ui.active_widget_theme(l) in ('bootstrap-light', 'clam')
          for bird, palette in yornis_theme.THEMES.items():
              yornis_theme.apply_theme(bird, persist=True)
              modern_ui.apply_modern_styles(l)
              assert modern_ui.primary_action_color(l) == palette['primary']
          yornis_theme.apply_theme('Agaporni', persist=True)
          modern_ui.apply_modern_styles(l)
          assert float(l.tk.call('tk','scaling')) > 0
          assert hasattr(l, '_scrollbar') and l._scrollbar.winfo_exists()
          assert hasattr(l, '_scroll_canvas') and l._scroll_canvas.winfo_exists()
          l.update_idletasks()
          bbox=l._scroll_canvas.bbox('all')
          assert bbox and (bbox[3]-bbox[1]) > l._scroll_canvas.winfo_height()
          before=l._scroll_canvas.yview()[0]
          l._scroll_canvas.yview_scroll(8, 'units'); l.update_idletasks()
          after=l._scroll_canvas.yview()[0]
          assert after > before
          assert hasattr(l, 'startup_sound_var')
          assert hasattr(l, 'startup_volume_var')
          assert len(l.palette_cards) == 10
          from yornis_bird_signature_v01592 import bundled_signature_path
          for bird in ('Agaporni','Tucán','Pavorreal','Ninfa','Faisán','Quetzal','Guacamaya Roja','Guacamaya Azul','Búho','Colibrí'):
              assert bundled_signature_path(bird, 35).name.endswith('_35.wav')
          from yornis_virtual_assistant_v0157 import make_avatar_photo
          for bird in ('Agaporni','Tucán','Pavorreal','Ninfa','Faisán','Quetzal','Guacamaya Roja','Guacamaya Azul','Búho','Colibrí'):
              image = make_avatar_photo(l, 64, bird)
              assert image.width() > 0 and image.height() > 0
          l.destroy()
          print('YORNIS v0.16.2 TEN PALETTES + OFFLINE GUI OK')
          '@ | python -

      - name: Build application
        shell: pwsh
        run: >-
          pyinstaller --noconfirm --clean --onedir --windowed --name Yornis
          --icon desktop/assets/yornis.ico
          --manifest desktop/yornis_windows.manifest
          --version-file desktop/yornis_version_info_v01592.txt
          --paths desktop
          --hidden-import classic_engine --hidden-import yomceph_desktop_v130_classic
          --hidden-import research_db --hidden-import research_protocol --hidden-import research_ui --hidden-import research_ui_compat --hidden-import research_enhancements
          --hidden-import research_stability_db_v0141 --hidden-import research_stability_ui_core_v0141 --hidden-import research_stability_ui_perf_v0141 --hidden-import research_stability_export_ui_v0141
          --hidden-import yornis_theme --hidden-import yornis_storage_v015 --hidden-import yornis_import_v015 --hidden-import yornis_background_import_v015 --hidden-import yornis_research_controls_v015 --hidden-import yornis_ui_theme_v015
          --hidden-import yornis_spss_v015 --hidden-import yornis_visual_report_v015 --hidden-import yornis_export_ui_v015 --hidden-import yornis_backup_v015 --hidden-import yornis_backup_ui_v015
          --hidden-import yornis_clinical_audit_v0151 --hidden-import yornis_cervical_v0152 --hidden-import yornis_alignment_v0152 --hidden-import yornis_display_v0152 --hidden-import yornis_ceph_quality_v0153 --hidden-import yornis_audit_hardening_v0154
          --hidden-import yornis_reference_help_v0154 --hidden-import yornis_reference_help_v0154_all --hidden-import yornis_evidence_v0155 --hidden-import yornis_quality_ui_v0156 --hidden-import yornis_reference_help_v0156
          --hidden-import yornis_quality_ui_v0157 --hidden-import yornis_virtual_assistant_v0157 --hidden-import yornis_quality_ui_v0158 --hidden-import yornis_startup_audio_v0159 --hidden-import yornis_desktop_v0159 --hidden-import yornis_desktop_v01591 --hidden-import yornis_bird_signature_v01592 --hidden-import yornis_modern_ui_v0160
          --collect-all PIL --collect-all pymupdf --collect-all reportlab --collect-all openpyxl --collect-all pyzipper --collect-all ttkbootstrap
          --add-data "desktop/assets/yornis_logo.png;." --add-data "desktop/assets/yornis.ico;." --add-data "desktop/assets/birds;assets/birds" --add-data "desktop/assets/bird_audio;assets/bird_audio" --add-data "desktop/assets/bird_startup_audio;assets/bird_startup_audio"
          desktop/yornis_desktop_v01592.py

      - name: Cold start with application outbound internet blocked
        shell: pwsh
        run: |
          $exe=(Resolve-Path 'dist/Yornis/Yornis.exe').Path
          $rule='Yornis-CI-Offline-Cold-Start'
          try {
            New-NetFirewallRule -DisplayName $rule -Direction Outbound -Program $exe -Action Block -Profile Any | Out-Null
            $p=Start-Process -FilePath $exe -PassThru
            Start-Sleep 8
            if($p.HasExited){throw 'Yornis exited during offline cold start'}
            Stop-Process -Id $p.Id -Force
            $bytes=[IO.File]::ReadAllBytes($exe)
            if($bytes[0]-ne 0x4D -or $bytes[1]-ne 0x5A){throw 'Missing MZ'}
          } finally {
            Get-NetFirewallRule -DisplayName $rule -ErrorAction SilentlyContinue | Remove-NetFirewallRule -ErrorAction SilentlyContinue
          }

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          New-Item -ItemType Directory -Force -Path dist-installer-yornis | Out-Null
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' desktop\Yornis_v01592.iss
          $setup='dist-installer-yornis/Yornis_Setup_v0.16.2_Modern_Interface_Offline.exe'
          if(!(Test-Path $setup)){throw 'Installer missing'}
          Compress-Archive -Path dist\Yornis\* -DestinationPath dist-installer-yornis\Yornis_v0.16.2_Modern_Interface_Offline_Portable.zip -Force

      - name: Checksums
        shell: pwsh
        run: |
          $a=Get-FileHash dist-installer-yornis\Yornis_Setup_v0.16.2_Modern_Interface_Offline.exe -Algorithm SHA256
          $b=Get-FileHash dist-installer-yornis\Yornis_v0.16.2_Modern_Interface_Offline_Portable.zip -Algorithm SHA256
          "$($a.Hash.ToLower())  Yornis_Setup_v0.16.2_Modern_Interface_Offline.exe" | Out-File dist-installer-yornis\SHA256SUMS.txt -Encoding ascii
          "$($b.Hash.ToLower())  Yornis_v0.16.2_Modern_Interface_Offline_Portable.zip" | Out-File dist-installer-yornis\SHA256SUMS.txt -Encoding ascii -Append

      - uses: actions/upload-artifact@v4
        with:
          name: Yornis-v0.16.2-Modern-Interface-Offline-Windows-x64
          path: |
            dist-installer-yornis/Yornis_Setup_v0.16.2_Modern_Interface_Offline.exe
            dist-installer-yornis/Yornis_v0.16.2_Modern_Interface_Offline_Portable.zip
            dist-installer-yornis/SHA256SUMS.txt


      - name: Publish stable release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @'
          Yornis v0.16.2 · Identidad + calibración guiada

          - Interfaz modernizada con ttkbootstrap 2.2.7.
          - Botones, controles, tablas, pestañas y campos con estilo plano y espaciado moderno.
          - Las diez paletas de aves mantienen sus colores y actualizan los controles en tiempo real.
          - Sistema visual aplicado al lanzador, caso individual e investigación.
          - 102 mediciones y 17 tablas de referencia conservadas.
          - Calibración por radiografía y control de confianza de landmarks conservados.
          - 10 identidades de aves y 100 WAV locales (perfiles de sonido generados) incluidos para ejecución offline.
          - Fórmulas, geometría, base de datos y lógica clínica sin cambios.
          '@ | Set-Content -Encoding utf8 release-notes.md

          $tag='v0.16.2'
          $setup='dist-installer-yornis/Yornis_Setup_v0.16.2_Modern_Interface_Offline.exe'
          $portable='dist-installer-yornis/Yornis_v0.16.2_Modern_Interface_Offline_Portable.zip'
          $sums='dist-installer-yornis/SHA256SUMS.txt'

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $setup $portable $sums --clobber
            gh release edit $tag --title "Yornis v0.16.2 · Identidad + calibración guiada" --notes-file release-notes.md --latest
          } else {
            gh release create $tag $setup $portable $sums --target $env:GITHUB_SHA --title "Yornis v0.16.2 · Identidad + calibración guiada" --notes-file release-notes.md --latest
          }
